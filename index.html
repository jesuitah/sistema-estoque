    function tempoRelativo(ts) {
      var diff = Date.now() - new Date(ts).getTime();
      var min = Math.floor(diff / 60000);
      if (min < 1) return 'agora';
      if (min < 60) return 'há ' + min + ' min';
      var h = Math.floor(min / 60);
      if (h < 24) return 'há ' + h + ' h';
      var d = Math.floor(h / 24);
      return 'há ' + d + (d > 1 ? ' dias' : ' dia');
    }

      function escolherPerfil(perfil) {
        setPerfilSel(perfil);
        setSenha('');
        setSenha2('');
        setErro('');
        setCarregando(true);
        supabase.from('app_perfis').select('senha').eq('perfil', perfil).single().then(function(res) {
          setCarregando(false);
          setSenhaAtualBd(res.data ? res.data.senha : null);
        });
      }

      function confirmar() {
        if (senhaAtualBd) {
          if (senha !== senhaAtualBd) { setErro('Senha incorreta.'); return; }
          props.onEntrar(perfilSel);
        } else {
          if (senha.length < 4) { setErro('A senha precisa ter pelo menos 4 caracteres.'); return; }
          if (senha !== senha2) { setErro('As senhas não coincidem.'); return; }
          setCarregando(true);
          supabase.from('app_perfis').update({ senha: senha }).eq('perfil', perfilSel).then(function() {
            setCarregando(false);
            props.onEntrar(perfilSel);
          });
        }
      }

      function formatarMoedaDigitando(valorDigitado) {
        var digitos = valorDigitado.replace(/\D/g, '');
        if (!digitos) return '';
        digitos = digitos.replace(/^0+(?=\d)/, '');
        while (digitos.length < 3) digitos = '0' + digitos;
        var centavos = digitos.slice(-2);
        var inteiro = digitos.slice(0, -2).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        return inteiro + ',' + centavos;

      function carregarEstoque() {
        var batchSize = 1000;
        var allData = [];

        function fetchBatch(from) {
          return supabase.from('estoque').select('*')
            .order('marca', {ascending: true})
            .order('sku', {ascending: true})
            .range(from, from + batchSize - 1)
            .then(function(result) {
              if (result.error) throw result.error;
              var data = result.data || [];
              allData = allData.concat(data);
              if (data.length === batchSize) return fetchBatch(from + batchSize);
              return allData;
            });
        }

        fetchBatch(0).then(function(data) {
          setEstoque(data);
          var total = data.length;
          var totalUnidades = data.reduce(function(sum, item) { return sum + (item.unidades || 0); }, 0);
          var zerados = data.filter(function(item) { return item.unidades === 0; }).length;
          setStats({total: total, unidades: totalUnidades, zerados: zerados});
          setLoading(false);
        }).catch(function(err) {
          console.error('Erro de conexão:', err);
          setLoading(false);
        });
      }

      // ── Robô: fila de tarefas ────────────────────────────────────────────────
      //
      // Por que existe uma fila: a ação de tirar do Full só funciona com a sessão
      // de navegador logada, que vive no PC do Matheus. O site não tem acesso a
      // isso. Então o site escreve a tarefa aqui e o robô, rodando lá, executa.
      // Se o PC estiver desligado, a tarefa espera — nada se perde.

      // O robô bate ponto a cada minuto. Se a última batida foi há mais de 3
      // minutos, consideramos que ele não está rodando.
      var ROBO_LIMITE_OFFLINE_MS = 3 * 60 * 1000;

      function roboEstaOnline(status) {
        if (!status || !status.ultima_batida) return false;
        return (Date.now() - new Date(status.ultima_batida).getTime()) < ROBO_LIMITE_OFFLINE_MS;
      }

      function carregarStatusRobo() {
        // Problemas em aberto que o vigia anotou. Vêm junto porque são lidos no mesmo
        // ritmo do status do robô.
        supabase.from('robo_alertas').select('*').is('resolvido_em', null)
          .order('gravidade').order('criado_em')
          .then(function(r) { if (!r.error && r.data) setAlertas(r.data); });

        supabase.from('robo_status').select('*').eq('id', 1).maybeSingle()
          .then(function(r) { if (!r.error) setRoboStatus(r.data); });

        // Histórico: sem isto, a tela esquece o que aconteceu assim que atualiza.
        supabase.from('ml_log_acoes')
          // 200 e não 60: as duas abas leem daqui, e com o limite baixo o histórico de
          // uma engolia o da outra — a patrulha sumia atrás das ações do "sem estoque".
          .select('*').order('quando', { ascending: false }).limit(200)
          .then(function(r) { if (!r.error && r.data) setLogAcoes(r.data); });

        supabase.from('ml_patrulha_full')
          .select('*').order('vista_em', { ascending: false }).limit(100)
          .then(function(r) { if (!r.error && r.data) setPatrulha(r.data); });

        supabase.from('ml_patrulha_execucoes')
          .select('*').order('quando', { ascending: false }).limit(60)
          .then(function(r) { if (!r.error && r.data) setPatrulhaExec(r.data); });

        supabase.from('ml_tarefas_robo')
          .select('id, conta, tipo, params, status, erro, resultado, criado_em, concluido_em')
          .order('criado_em', { ascending: false })
          .limit(200)
          .then(function(r) {
            if (r.error || !r.data) return;
            var porItem = {};
            var emAndamento = 0;
            var patrulhaNaFila = false;
            r.data.forEach(function(t) {
              var ativa = t.status === 'pendente' || t.status === 'rodando';
              if (ativa) emAndamento++;
              if (ativa && t.tipo === 'patrulha_agora') patrulhaNaFila = true;
              var chave = t.params && t.params.item_id;
              // guarda só a tarefa mais recente de cada anúncio
              if (chave && !porItem[chave]) porItem[chave] = t;
            });
            setRoboTarefas(porItem);
            setPatrulhaRodando(patrulhaNaFila);

            // Quando o robô esvazia a fila, a lista da tela fica velha: os concluídos
            // continuam aparecendo e você teria que atualizar a página na mão. Então,
            // assim que o último termina, refazemos a verificação sozinho.
            var tinhaTrabalho = window._roboEmAndamento > 0;
            window._roboEmAndamento = emAndamento;
            if (tinhaTrabalho && emAndamento === 0 && anunciosReativarResultado) {
              reativarAnunciosSemEstoque();
            }
          });
      }

      // Quando cada rotina rodou pela última vez.
      //
      // Cada uma deixa rastro num lugar diferente: a patrulha em ml_patrulha_execucoes,
      // o catálogo no atualizado_em dos anúncios, as promoções no cache delas. Juntamos
      // aqui pra aba Robô poder dizer "há 12 min" em vez de deixar você clicar no escuro.
      function carregarUltimasExecucoes() {
        var novo = {};
        function guardar(chave, valor) {
          novo[chave] = valor;
          setRoboUltimas(Object.assign({}, novo));
        }
        supabase.from('ml_patrulha_execucoes').select('quando')
          .order('quando', { ascending: false }).limit(1)
          .then(function(r) { if (r.data && r.data[0]) guardar('patrulha', r.data[0].quando); });

        supabase.from('ml_anuncios').select('atualizado_em')
          .order('atualizado_em', { ascending: false }).limit(1)
          .then(function(r) { if (r.data && r.data[0]) guardar('catalogo', r.data[0].atualizado_em); });

        supabase.from('ml_promocoes_itens').select('atualizado_em')

          .then(function(r) { if (r.data && r.data[0]) guardar('promocoes', r.data[0].atualizado_em); });

        supabase.from('ml_fretes').select('criado_em')

      }

      // "há 12 min" — para a coluna de última execução.
      function desdeQuando(quando) {
        if (!quando) return 'nunca';
        var min = Math.floor((Date.now() - new Date(quando).getTime()) / 60000);
        if (min < 1) return 'agora';
        if (min < 60) return 'há ' + min + ' min';
        var h = Math.floor(min / 60);
        if (h < 24) return 'há ' + h + (h > 1 ? ' horas' : ' hora');
        var d = Math.floor(h / 24);
        return 'há ' + d + (d > 1 ? ' dias' : ' dia');
      }

      // Passou do prazo em que essa rotina deveria ter rodado sozinha?
      function estaAtrasada(quando, limiteHoras) {
        if (!quando) return true;
        return (Date.now() - new Date(quando).getTime()) > limiteHoras * 3600000;
      }

      // O selo que substituiu os botões "rodar agora" das abas de trabalho.
      //
      // Os botões saíram porque viraram duplicata: tudo o que eles faziam agora vive na

      //
      // O que ficou é a informação que importa aqui: está em dia ou não. Clicar leva

      function seloAtualizacao(chave, limiteHoras) {

            (atrasado

      // O botão mestre: roda de uma vez o que o Matheus faria clicando em três abas.

          return fetch('https://pylkufhziohxvwbbaued.supabase.co/functions/v1/ml-sincronizar-anuncios?conta=' + conta)
            .then(function(r) { return r.json(); });

            return supabase.from('ml_tarefas_robo').insert({

          });

      // ── Promoções: conversa com o servidor ─────────────────────────────────
      //
      // A varredura (descobrir o que cada anúncio aceita) roda no robô, porque são
      // ~1.100 chamadas por loja e o servidor tem tempo limite. A tela aqui só LÊ o
      // resultado guardado, então abre na hora. A ativação é no servidor.
      var PROMO_URL = 'https://pylkufhziohxvwbbaued.supabase.co/functions/v1/ml-promocoes';
      function promoCabecalhos() {
        return { 'Authorization': 'Bearer ' + supabaseKey, 'apikey': supabaseKey, 'Content-Type': 'application/json' };
      }

      function carregarPromocoes() {

      // Manda o robô recatalogar as promoções. É ele que faz porque são ~1.100
      // chamadas por loja — o servidor corta antes de terminar. A tela acompanha o
      // andamento pelo robo_status, igual à patrulha.
      function pedirVarreduraPromocoes(conta) {
        // Marca "pedido" na hora. Sem isto o botão fica mudo por até meio minuto — o
        // robô só olha a fila a cada 3s e a tela só relê o status a cada 30s — e você
        // não sabe se o clique funcionou.
        setPromoPedindo(true);
        // Não empilha pedidos. Clicar 3x criava 3 varreduras seguidas da mesma loja —
        // ~18 minutos de trabalho repetido pelo mesmo resultado.
        supabase.from('ml_tarefas_robo')
          .select('id').eq('tipo', 'varrer_promocoes').eq('conta', conta)
          .in('status', ['pendente', 'rodando']).limit(1)
          .then(function(r) {
            if (r.data && r.data.length) { carregarStatusRobo(); return; }
            enfileirarVarredura(conta);
          });
      }

      function enfileirarVarredura(conta) {
        supabase.from('ml_tarefas_robo').insert({
          conta: conta, tipo: 'varrer_promocoes', status: 'pendente',
          params: { conta: conta },
        }).then(function() {
          carregarStatusRobo();
          // Enquanto o robô não começa, insistimos em reler o status a cada 3s.
          var tentativas = 0;
          var relogio = setInterval(function() {
            tentativas++;
            carregarStatusRobo();
            if (tentativas > 20) { clearInterval(relogio); setPromoPedindo(false); }
          }, 3000);
        }, function() { setPromoPedindo(false); });
      }

      function abrirPromocao(p) {
        setPromoSel(p);
        setPromoMarcados({});
        setPromoResultado(null);
        setPromoBusca('');
        recarregarItens(p, true);
      }

      // Relê os anúncios da loja.
      //
      // `mostrarCarregando` é o que separa ABRIR de ATUALIZAR. Ao abrir uma promoção,
      // trocar a lista por "carregando..." é certo. Depois de aplicar um desconto, NÃO:
      // a lista some por um instante, a página encolhe, o navegador joga a rolagem lá
      // pra cima e você perde o lugar onde estava trabalhando. Aqui a lista fica de pé
      // e só troca de conteúdo quando os dados novos chegam.
      function recarregarItens(p, mostrarCarregando) {
        if (mostrarCarregando) setPromoCarregando(true);
        // Carrega TODAS as promoções da loja, não só a aberta: cada anúncio mostra a
        // lista inteira dele, pra você comparar antes de decidir. Vem em páginas
        // porque o Supabase devolve no máximo 1000 linhas por vez, e a KMP tem 2.300.
        (function carregarTudo(inicio, acumulado) {
          supabase.from('ml_promocoes_itens').select('*')
            .eq('conta', p.conta).order('item_id').range(inicio, inicio + 999)
            .then(function(r) {
              if (r.error || !r.data) { setPromoCarregando(false); return; }
              var tudo = acumulado.concat(r.data);
              if (r.data.length === 1000) { carregarTudo(inicio + 1000, tudo); return; }
              setPromoCarregando(false);
              setPromoItens(tudo);
            });
        })(0, []);
        // Aqui havia uma segunda consulta, montando "em quais outras promoções este
        // anúncio já está". Ela alimentava o aviso "+3 outras promoções", que foi
        // removido a pedido do Matheus — e continuou rodando a cada abertura de
        // promoção, buscando dados que ninguém lia. Cada bloco já mostra todas as
        // promoções do anúncio, que era o objetivo.
      }

      function alternarMarcado(itemId) {
        var novo = Object.assign({}, promoMarcados);
        if (novo[itemId]) delete novo[itemId]; else novo[itemId] = true;
        setPromoMarcados(novo);
      }

      // O termo da busca casa com título, SKU ou número do anúncio.
      function casaComABusca(base, termo) {
        if (!termo) return true;
        return (base.title || '').toLowerCase().indexOf(termo) !== -1
            || (base.sku || '').toLowerCase().indexOf(termo) !== -1
            || (base.item_id || '').toLowerCase().indexOf(termo) !== -1;
      }

      // Quais promoções aparecem na tela.
      //
      // REGRA 1 — SE ESTÁ VALENDO, APARECE. Sem exceção.
      // Uma promoção ativa é o preço que o cliente paga hoje. Escondê-la faz a tela
      // mentir: o Trocador de Óleo Amarok aparecia por R$ 286,94 (campanha do Matheus)
      // quando vendia por R$ 270,06, porque a 9.9 estava ativa e filtrada. Eram 401
      // anúncios nessa situação, e em muitos deles nem o selo ATIVA E GANHANDO
      // aparecia — a vencedora era justamente a linha escondida.
      //
      // REGRA 2 — se é só uma oferta disponível, vale o filtro de sempre: as campanhas
      // do Matheus e aquelas em que o Mercado Livre banca parte. O resto seriam
      // centenas de linhas "participar" para decisões que ele não vai tomar.
      // Promoções em que o preço é escolhido por VOCÊ. Nas outras (Impulsione, Acelere,
      // Pix, Cobrir concorrência) quem define o desconto é o Mercado Livre, e mandar um
      // percentual não faz nada.
      //
      // É a MESMA lista que a Edge Function usa pra decidir se envia `deal_price`. Se
      // as duas discordarem, a tela promete um desconto que o servidor não aplica.
      var PRECO_ESCOLHIDO_POR_VOCE = ['SELLER_CAMPAIGN', 'DEAL', 'PRICE_DISCOUNT', 'DOD'];

      function promocaoRelevante(l) {
        if (l.status === 'started') return true;
        return l.promocao_tipo === 'SELLER_CAMPAIGN'
            || Number(l.meli_percentual) > 0
            || ['SMART', 'UNHEALTHY_STOCK', 'PRICE_MATCHING', 'BANK'].indexOf(l.promocao_tipo) !== -1;
      }

      // Quanto sobra depois da tarifa do Mercado Livre E DO FRETE.
      //
      // O frete estava de fora e a coluna mentia pra cima. Em dois meses foram
      // R$ 44.875 de frete pago — num anúncio de R$ 85 ele come mais que a tarifa.
      // O custo vem calculado do banco (real do anúncio, média da categoria ou da
      // faixa de preço, nessa ordem); `frete_origem` diz qual foi, pra tela poder
      // separar o que é fato do que é estimativa.
      // O Mercado Livre cobra percentuais diferentes acima e abaixo de R$ 79 — a mesma
      // linha que muda o frete. Como o desconto pode cruzar essa fronteira (um item de
      // R$ 85 com 20% cai para R$ 68), a tarifa é escolhida pelo preço FINAL daquela
      // promoção, não pelo preço cheio do anúncio.
      var CORTE_TARIFA = 79;

      function tarifaDaLinha(l, preco) {
        if (preco == null) return null;
        var pct = preco < CORTE_TARIFA ? l.tarifa_pct_baixo : l.tarifa_pct_alto;
        if (pct == null) pct = l.tarifa_percentual;   // anúncio ainda sem tarifa medida
        return pct == null ? null : Number(pct);
      }

      function quantoSobra(l, preco) {
        var pct = tarifaDaLinha(l, preco);
        if (preco == null || pct == null) return null;
        return preco
          - (preco * pct / 100)
          - Number(l.tarifa_fixa || 0)
          - Number(l.frete_custo || 0);
      }

      // De onde saiu o número do frete, em uma frase.
      var FRETE_FONTE = {
        real: function(n) { return 'do que você pagou neste anúncio' + (n ? ' em ' + n + ' venda' + (n > 1 ? 's' : '') : ''); },
        categoria: function() { return 'média da categoria — este anúncio ainda não vendeu'; },
        faixa: function() { return 'estimativa pela faixa de preço'; },
      };

      // A conta inteira, para o hover do "Você recebe".
      //
      // O frete saiu da tela a pedido do Matheus: atrapalhava a leitura e ele não
      // precisa lê-lo para decidir — precisa é confiar que já está descontado. Aqui
      // fica o detalhe, para conferir sem abrir o banco.
      function explicarQuantoSobra(l, preco) {
        var partes = ['preço ' + moeda(preco)];
        var pct = tarifaDaLinha(l, preco);
        if (pct != null) {
          var fonte = l.tarifa_origem === 'real'
            ? 'do que você pagou' + (l.tarifa_vendas ? ' em ' + l.tarifa_vendas + ' venda' + (l.tarifa_vendas > 1 ? 's' : '') : '')
            : l.tarifa_origem === 'categoria' ? 'média da categoria'
            : 'tabela do Mercado Livre';
          partes.push('− tarifa ' + pct.toFixed(1).replace('.', ',') + '%  '
            + moeda(preco * pct / 100) + '  (' + fonte + ')');
        }
        if (Number(l.tarifa_fixa) > 0) partes.push('− taxa fixa  ' + moeda(l.tarifa_fixa));
        if (Number(l.frete_custo) > 0) {
          var origem = (FRETE_FONTE[l.frete_origem] || function() { return ''; })(l.frete_vendas);
          partes.push('− frete  ' + moeda(l.frete_custo) + (origem ? '  (' + origem + ')' : ''));
        }
        return partes.join('\n');
      }

      var moeda = function(v) {
        return 'R$ ' + Number(v).toFixed(2).replace('.', ',');
      };

      // Um anúncio e todas as promoções dele, empilhadas.
      function blocoDoAnuncio(a, pct) {
        var base = a.base;
        var cheio = Number(base.preco_cheio || 0);
        var marcado = !!promoMarcados[a.id];

        // A promoção que você abriu vem sempre primeiro. É nela que você está
        // trabalhando — procurá-la no meio da lista a cada anúncio é trabalho à toa.
        var principais = a.linhas.filter(promocaoRelevante).sort(function(x, y) {
          var xAberta = promoSel && x.promocao_id === promoSel.promocao_id;
          var yAberta = promoSel && y.promocao_id === promoSel.promocao_id;
          if (xAberta !== yAberta) return xAberta ? -1 : 1;
          return (x.promocao_nome || '').localeCompare(y.promocao_nome || '');
        });

        // QUAL PROMOÇÃO O CLIENTE REALMENTE VÊ
        // O ML aceita o anúncio em várias ao mesmo tempo e mostra sempre o MENOR
        // preço. Só marcamos quando há disputa — com uma ativa só, é redundante.
        var ativasComPreco = a.linhas.filter(function(x) { return x.status === 'started' && x.preco_promo; });
        var vencedora = null;
        if (ativasComPreco.length > 1) {
          ativasComPreco.forEach(function(x) {
            if (!vencedora || Number(x.preco_promo) < Number(vencedora.preco_promo)) vencedora = x;
          });
        }

        function linhaDaPromocao(l) {
          var ativa = l.status === 'started';
          var preco = l.preco_promo != null ? Number(l.preco_promo) : null;
          var simulado = false;

          // Promoção não ativada em que VOCÊ escolhe o preço: mostramos como ficaria
          // com o percentual digitado na barra. Sem isso a linha vem vazia e não ajuda
          // a decidir.
          //
          // Antes só simulava as campanhas do Matheus. Mas a 9.9 e as Clearance também
          // aceitam preço livre — abrir uma delas dava uma lista inteira de traços, sem
          // como comparar. A lista é a mesma que o servidor usa para decidir se manda
          // `deal_price`; fora dela quem define o desconto é o Mercado Livre.
          var euEscolhoOPreco = PRECO_ESCOLHIDO_POR_VOCE.indexOf(l.promocao_tipo) !== -1;
          if (preco == null && euEscolhoOPreco && !isNaN(pct) && cheio) {
            preco = Math.floor(cheio * (1 - pct / 100) * 100) / 100;
            simulado = true;
          }

          var descontoReais = preco != null ? cheio - preco : null;
          var descontoPct = preco != null ? Math.round((1 - preco / cheio) * 1000) / 10 : null;
          var sobra = quantoSobra(l, preco);
          var bancaReais = Number(l.meli_percentual) > 0 ? cheio * Number(l.meli_percentual) / 100 : null;
          var venceu = vencedora && vencedora.promocao_id === l.promocao_id;

          return e('div', {
            key: l.promocao_id + l.promocao_tipo,
            // O destaque verde marca onde o MERCADO LIVRE ajuda — não onde está ativa.
            // Nas campanhas dele o realce não dizia nada (é ele quem paga o desconto
            // inteiro), e ainda competia com as etiquetas, que já contam o status.
            className: 'grid items-center gap-2 px-3 py-1.5 text-xs border-b border-slate-800 ' +
              // A última coluna tem 132px porque é ela que abriga o campo de digitar o
              // percentual (número + % + confirmar + cancelar). Com 80px o campo não
              // cabia e vazava por cima da coluna "Você recebe".
              'grid-cols-[1fr_66px_74px_104px_92px] ' +
              (bancaReais
                ? 'bg-emerald-900 bg-opacity-20 border-l-[3px] border-l-emerald-500'

          },
            e('div', {className: 'flex items-center gap-2 flex-wrap min-w-0'},
              e('span', {className: 'text-slate-200 truncate'}, l.promocao_nome),
              // Duas etiquetas, com as cores do painel do Mercado Livre.
              //
              // VERDE "ATIVA" = é esta que o cliente está pagando.
              // AZUL "PROGRAMADA" = está valendo também, mas outra tem preço menor e é
              // aquela que vale. Fica esperando a vez.
              //
              // Antes as duas eram verdes ("ATIVA" e "ATIVA E GANHANDO") e o bloco
              // inteiro virava um borrão da mesma cor — não dava pra achar de relance
              // qual estava valendo, que é justamente a pergunta.
              ativa && (
                (!vencedora || venceu)
                  ? e('span', {className: 'bg-emerald-900 text-emerald-300 text-[10px] font-bold px-2 py-0.5 rounded-full whitespace-nowrap'}, 'ATIVA')
                  : e('span', {className: 'bg-sky-900 text-sky-300 text-[10px] font-bold px-2 py-0.5 rounded-full whitespace-nowrap'}, 'PROGRAMADA')
              )
            ),
            e('div', {className: 'text-right ' + (simulado ? 'opacity-60 italic' : '')},
              descontoReais != null ? moeda(descontoReais) : '—',
              descontoPct != null && e('div', {className: 'text-slate-500 text-[12px]'}, '(' + descontoPct + '%)')
            ),
            e('div', {className: 'text-right ' + (simulado ? 'opacity-60 italic' : '')},
              preco != null ? moeda(preco) : '—'),
            e('div', {className: 'text-right ' + (simulado ? 'opacity-60 italic' : '')},
              // O FRETE ENTRA NA CONTA MAS NÃO APARECE NA TELA.
              //
              // Ele é indispensável pro número estar certo — são R$ 45 mil em dois
              // meses — mas o Matheus não precisa lê-lo para decidir nada: precisa
              // confiar que já foi descontado. Mostrá-lo em toda linha só atrapalhava
              // a leitura. Fica no hover, pra quando ele quiser conferir a origem.
              // VERDE SÓ ONDE O MERCADO LIVRE AJUDA.
              //
              // Todo valor era verde e a coluna virava um bloco de uma cor só — não
              // dava pra ver de relance onde havia coparticipação, que é o que
              // diferencia uma promoção da outra. No painel do ML o número é neutro e
              // o verde marca o benefício; aqui o verde marca as duas coisas juntas,
              // como o Matheus pediu: o valor e a frase da redução.
              e('div', {
                className: 'font-bold ' + (bancaReais ? 'text-emerald-400' : 'text-slate-100'),
                title: sobra == null ? '' : explicarQuantoSobra(l, preco),
              }, sobra != null ? moeda(sobra) : '—'),
              // Frase curta desde que a coluna encolheu para caber dois anúncios por
              // linha: a do Mercado Livre ("Reduzimos R$ X das suas tarifas por cada
              // venda") quebrava em três linhas e esticava o bloco inteiro. O sentido
              // é o mesmo; o título completo fica no hover.
              bancaReais && e('div', {
                className: 'text-emerald-400 font-semibold text-[11.5px] leading-snug mt-1',
                title: 'Reduzimos ' + moeda(bancaReais) + ' das suas tarifas por cada venda',
              }, 'Reduzimos ' + moeda(bancaReais) + ' por venda')
            ),
            // Ação individual: clica, digita o percentual ali mesmo e confirma.
            // Sem marcar caixinha e sem subir até a barra — é o ajuste pontual.
            (function() {
              var chave = a.id + '|' + l.promocao_id;
              if (promoLinhaEdit === chave) {
                return e('div', {className: 'flex items-center gap-1 justify-end'},
                  // Número e "%" moram na mesma caixinha, como na barra de cima —
                  // o "%" solto ao lado do campo ficava perdido.
                  //
                  // Compacto porque a coluna encolheu para caber dois anúncios por
                  // linha. O ✕ saiu: Esc cancela, e clicar em qualquer outra linha
                  // também — o botão só ocupava espaço que não havia mais.
                  e('div', {className: 'flex items-center bg-slate-950 border border-blue-600 rounded h-6 pr-1'},
                    e('input', {
                      type: 'text', value: promoPctLinha, autoFocus: true,
                      // O campo abre com o percentual atual já escrito. Sem selecionar
                      // tudo, digitar 12 em cima de um 10 podia virar 102, 120 ou 1210
                      // dependendo de onde o cursor caiu — e você só descobria depois de

                      onFocus: function(ev) { ev.target.select(); },
                      onChange: function(ev) { setPromoPctLinha(ev.target.value); },
                      onKeyDown: function(ev) {

                        if (ev.key === 'Escape') setPromoLinhaEdit(null);
                      },
                      className: 'bg-transparent border-0 outline-none w-8 text-center text-slate-100 font-bold text-xs'
                    }),
                    e('span', {className: 'text-slate-500 text-[10px]'}, '%')
                  ),
                  e('button', {
                    onClick: function() { aplicarNaLinha(a.id, l); },
                    disabled: promoAtivando,
                    title: 'aplicar (Enter) · Esc cancela',
                    className: 'bg-emerald-600 hover:bg-emerald-500 text-white rounded h-6 w-6 flex items-center justify-center text-[11px] font-bold flex-shrink-0'
                  }, promoAtivando ? '…' : '✓')
                );
              }
              return e('div', {className: 'text-right'},
                e('button', {
                  onClick: function() {
                    setPromoLinhaEdit(chave);
                    // Começa com o percentual que já está valendo, ou o da barra.
                    setPromoPctLinha(descontoPct != null ? String(descontoPct) : String(promoPercentual));
                  },
                  className: 'text-[11px] ' + (ativa ? 'text-slate-400 hover:text-slate-200' : 'text-blue-400 hover:text-blue-300')
                }, ativa ? 'alterar' : 'participar')
              );
            })()
          );
        }

        return e('div', {
          key: a.id,
          className: 'bg-slate-800 border rounded-lg overflow-hidden ' +
            (marcado ? 'border-blue-600' : 'border-slate-700')
        },
          e('div', {className: 'flex items-start gap-2.5 px-3 py-2 border-b border-slate-700'},
            e('input', {
              type: 'checkbox', checked: marcado,
              onChange: function() { alternarMarcado(a.id); },
              className: 'w-4 h-4 mt-0.5 flex-shrink-0'
            }),
            e('div', {className: 'flex-1 min-w-0'},
              e('div', {className: 'font-semibold text-sm truncate', title: base.title || ''}, base.title || a.id),
              // Preço cheio ao lado do SKU, na mesma linha.
              //
              // Estava sozinho na ponta direita, cinza e pequeno: pra comparar com os
              // preços da promoção era preciso atravessar o bloco com o olho toda vez.
              // Aqui ele fica junto do que identifica a peça, e destacado — é o número
              // de referência de todas as contas de baixo.
              e('div', {className: 'flex items-baseline gap-2 mt-0.5 min-w-0'},
                base.sku && e('span', {className: 'text-amber-400 text-[13px] font-semibold truncate'}, base.sku),
                // Mesmo tamanho do SKU. Com 15px ao lado de 12px a dupla ficava
                // desalinhada; o preço se destaca pelo branco e pelo negrito.
                e('span', {className: 'text-slate-100 text-[13px] font-bold whitespace-nowrap'}, moeda(cheio))
              )
            )
          ),
          e('div', {className: 'grid gap-2 px-3 py-1.5 text-[10px] uppercase tracking-wide text-slate-500 border-b border-slate-700 grid-cols-[1fr_66px_74px_104px_92px]'},
            e('div', null, 'Promoção'),
            e('div', {className: 'text-right'}, 'Desconto'),
            e('div', {className: 'text-right'}, 'Preço final'),
            e('div', {className: 'text-right'}, 'Você recebe'),
            e('div', null)
          ),
          principais.map(linhaDaPromocao)
        );
      }

      // "03/08 a 02/09" — o período em que a promoção vale.
      function periodoDaPromocao(p) {
        function dia(d) {
          if (!d) return null;
          var x = new Date(d);
          if (isNaN(x.getTime())) return null;
          return x.toLocaleDateString('pt-BR', {day: '2-digit', month: '2-digit'});
        }
        var i = dia(p.data_inicio), f = dia(p.data_fim);
        if (i && f) return '📅 ' + i + ' a ' + f;
        if (f) return '📅 até ' + f;
        if (i) return '📅 desde ' + i;
        return '';
      }

      // Quantos dias faltam pra promoção acabar. Serve pra pintar de amarelo o que
      // está terminando — ativar numa campanha que acaba amanhã é trabalho perdido.
      function diasAteFim(dataFim) {
        if (!dataFim) return null;
        var x = new Date(dataFim);
        if (isNaN(x.getTime())) return null;
        return Math.ceil((x.getTime() - Date.now()) / 86400000);
      }

      // Preço que o anúncio vai ficar com o percentual escolhido. Sempre sobre o cheio.
      function precoComDesconto(item, percentual) {
        var cheio = Number(item.preco_cheio || 0);
        if (!cheio || !percentual) return null;
        return Math.round(cheio * (1 - percentual / 100) * 100) / 100;
      }

      // O ML impõe um limite por anúncio. Aqui só avisamos ANTES de enviar, pra tela
      // não prometer o que vai ser recusado.
      function foraDoLimite(item, percentual) {
        var preco = precoComDesconto(item, percentual);
        if (preco === null || item.preco_min == null || item.preco_max == null) return null;
        if (preco > Number(item.preco_max)) return 'pouco';
        if (preco < Number(item.preco_min)) return 'muito';
        return null;
      }

      // Aplica em UM anúncio, na promoção daquela linha — que nem sempre é a que está
      // aberta. Serve pro ajuste pontual, sem marcar caixinha nem subir até a barra.
      function aplicarNaLinha(itemId, linha) {
        var pct = parseFloat(String(promoPctLinha).replace(',', '.'));
        // Valor impossível não vai pro servidor: antes o campo em branco apenas não
        // fazia nada, sem dizer por quê.
        if (isNaN(pct) || pct <= 0 || pct >= 100) {
          setPromoResultado({ erro: 'Desconto inválido — use um número entre 1 e 99.' });
          return;
        }
        setPromoAtivando(true);
        setPromoResultado(null);

        fetch(PROMO_URL + '?acao=ativar', {
          method: 'POST',
          headers: promoCabecalhos(),
          body: JSON.stringify({
            conta: linha.conta,
            promocao_id: linha.promocao_id,
            promocao_tipo: linha.promocao_tipo,
            percentual: pct,
            itens: [itemId],
          }),
        })
          .then(function(r) { return r.json(); })
          .then(function(d) {
            setPromoAtivando(false);
            setPromoLinhaEdit(null);
            setPromoResultado(d);
            // Atualização silenciosa: sem apagar a lista, sem limpar a busca nem as
            // caixinhas marcadas, e sem perder onde você estava na página.
            if (promoSel) recarregarItens(promoSel, false);
            carregarPromocoes();
          })
          .catch(function() {
            setPromoAtivando(false);
            setPromoResultado({ erro: 'não consegui falar com o servidor' });
          });
      }

      function ativarPromocao() {
        if (!promoSel) return;
        var ids = Object.keys(promoMarcados);
        if (!ids.length) return;
        var pct = parseFloat(String(promoPercentual).replace(',', '.'));

        // Avisa AQUI, antes de mandar.
        //
        // Com a caixinha vazia a tela mandava percentual nulo, o servidor tentava um a
        // um e devolvia "esta promoção precisa de um percentual" repetido para cada
        // anúncio marcado — uma lista de erros vermelhos para um campo em branco.
        var precisaPct = PRECO_ESCOLHIDO_POR_VOCE.indexOf(promoSel.promocao_tipo) !== -1;
        if (precisaPct && (isNaN(pct) || pct <= 0)) {
          setPromoResultado({ erro: 'Digite o desconto (em %) na caixinha antes de aplicar.' });
          return;
        }
        if (precisaPct && pct >= 100) {
          setPromoResultado({ erro: 'O desconto tem que ser menor que 100%.' });
          return;
        }

        setPromoAtivando(true);
        setPromoResultado(null);

        fetch(PROMO_URL + '?acao=ativar', {
          method: 'POST',
          headers: promoCabecalhos(),
          body: JSON.stringify({
            conta: promoSel.conta,
            promocao_id: promoSel.promocao_id,
            promocao_tipo: promoSel.promocao_tipo,
            percentual: isNaN(pct) ? null : pct,
            itens: ids,
          }),
        })
          .then(function(r) { return r.json(); })
          .then(function(d) {
            setPromoAtivando(false);
            setPromoResultado(d);
            setPromoMarcados({});
            recarregarItens(promoSel, false);   // mostra quem entrou sem perder o lugar
            carregarPromocoes();
          })
          .catch(function() {
            setPromoAtivando(false);
            setPromoResultado({ erro: 'não consegui falar com o servidor' });
          });
      }

      // Botão de pânico. Não mata o programa (o site não tem esse poder) — levanta uma
      // bandeira no banco que o robô consulta antes de pegar cada tarefa. Ele continua
      // vivo, só para de trabalhar até você retomar.
      function pararOuRetomarRobo() {
        var vaiParar = !(roboStatus && roboStatus.parar);
        if (vaiParar && !confirm('Parar o robô?\n\nEle deixa de executar tarefas até você retomar. As tarefas ficam esperando na fila, nada se perde.')) return;

        supabase.from('robo_status').update({ parar: vaiParar }).eq('id', 1).then(function(r) {
          if (r.error) { alert('Não consegui alterar: ' + r.error.message); return; }
          carregarStatusRobo();
        });
      }

      // Sem confirmação: se clicou no botão, é porque quer. A ação é reversível
      // (dá pra voltar a oferecer Full) e o estado aparece no próprio card.
      function enviarParaRobo(item, conta) {
        supabase.from('ml_tarefas_robo').insert({
          conta: conta,
          tipo: 'tirar_do_full',
          params: {
            item_id: item.item_id, title: item.title, sku_bruto: item.sku_bruto,
            // o que fazer depois de sair do Full: reativar vendendo, ou pausar pra inativos
            acao_depois: item.acao_depois || (item.tem_estoque ? 'ativar' : 'inativar')
          },
          criado_por: perfilAtivo || null
        }).then(function(r) {
          if (r.error) {
            // índice único impede enfileirar a mesma coisa duas vezes
            if (String(r.error.message || '').indexOf('duplicate') !== -1) {
              alert('Esse anúncio já está na fila do robô.');
            } else {
              alert('Não consegui enfileirar: ' + r.error.message);
            }
            return;
          }
          carregarStatusRobo();
        });
      }

      // Enfileira vários de uma vez. O robô continua executando um por um (ou em lote,
      // se conseguir), mas você clica uma vez só.
      // "Rodar agora" da patrulha. O site não consegue acionar o robô diretamente
      // (ele vive no PC do Matheus), então enfileira um pedido e ele executa na hora.
      function pedirPatrulhaAgora() {
        supabase.from('ml_tarefas_robo').insert({
          conta: 'KMP',                 // a patrulha varre as 3 lojas; a conta aqui é só formalidade
          tipo: 'patrulha_agora',
          params: {},
          criado_por: perfilAtivo || null
        }).then(function(r) {
          if (r.error) { alert('Não consegui pedir a passada: ' + r.error.message); return; }
          carregarStatusRobo();
        });
      }

      function enviarTodosParaRobo(itens, conta) {
        if (!itens.length) return;
        var linhas = itens.map(function(item) {
          return {
            conta: conta,
            tipo: 'tirar_do_full',
            params: {
              item_id: item.item_id, title: item.title, sku_bruto: item.sku_bruto,
              acao_depois: item.acao_depois || (item.tem_estoque ? 'ativar' : 'inativar')
            },
            criado_por: perfilAtivo || null
          };
        });

        // ignoreDuplicates evita erro quando algum já está na fila
        supabase.from('ml_tarefas_robo').upsert(linhas, { ignoreDuplicates: true }).then(function(r) {
          if (r.error) { alert('Não consegui enfileirar: ' + r.error.message); return; }
          carregarStatusRobo();
        });
      }

      function carregarAnunciosGaps() {
        setAnunciosCarregando(true);
        setAnunciosErro('');
        supabase.rpc('anuncios_gaps').then(function(result) {
          setAnunciosCarregando(false);
          if (result.error) { setAnunciosErro('Não foi possível carregar os anúncios. Verifique sua conexão.'); return; }
          setAnunciosGaps(result.data || []);
        });
      }

      // Recataloga os anúncios das 3 contas puxando direto da API do Mercado Livre
      // (title, categoria, preço, SKU) e recalcula os gaps em seguida.
      function sincronizarAnuncios() {
        setAnunciosSincronizando(true);
        setAnunciosErro('');
        Promise.all(['KMP', 'ERP', 'LTS'].map(function(conta) {
          return fetch('https://pylkufhziohxvwbbaued.supabase.co/functions/v1/ml-sincronizar-anuncios?conta=' + conta)
            .then(function(resp) { return resp.json(); });
        })).then(function() {
          setAnunciosSincronizando(false);
          carregarAnunciosGaps();
        }).catch(function(err) {
          console.error('Erro ao sincronizar anúncios ML:', err);
          setAnunciosSincronizando(false);
          setAnunciosErro('Falha ao sincronizar anúncios com o Mercado Livre. Tente novamente.');
        });
      }

      function reativarAnunciosSemEstoque() {
        setAnunciosReativando(true);
        setAnunciosReativarErro('');
        fetch('https://pylkufhziohxvwbbaued.supabase.co/functions/v1/ml-reativar-anuncios')
          .then(function(resp) { return resp.json(); })
          .then(function(dados) {
            setAnunciosReativando(false);
            setAnunciosReativarResultado(dados);
          })
          .catch(function(err) {
            console.error('Erro ao reativar anúncios:', err);
            setAnunciosReativando(false);
            setAnunciosReativarErro('Falha ao verificar/reativar anúncios. Tente novamente.');
          });
      }

      // Extrai o motivo REAL da recusa do Mercado Livre.
      //
      // A resposta de erro do ML vem com uma lista "cause" que mistura erros de verdade
      // com avisos inofensivos (atributos que ele simplesmente ignora). Só o que tem
      // type "error" impede a criação — o resto é ruído. Sem esse filtro, a mensagem
      // que aparecia era genérica e não dava pra saber o que consertar.
      function motivoDaFalha(dados) {
        var generico = (dados && dados.erro) || 'Falha ao clonar anúncio.';
        var causas = dados && dados.detalhe && dados.detalhe.cause;
        if (!Array.isArray(causas)) return generico;

        var erros = causas.filter(function(c) { return c && c.type === 'error'; });
        if (erros.length === 0) return generico;

        return erros.map(function(c) { return c.message || c.code; }).join(' · ');
      }

      function clonarAnuncio(gap, contaOrigem, contaDestino) {
        var chave = gap.marca + '|' + gap.sku;
        var itemIdOrigem = contaOrigem === 'KMP' ? gap.item_id_kmp : contaOrigem === 'ERP' ? gap.item_id_erp : gap.item_id_lts;
        if (!confirm('Clonar o anúncio da ' + contaOrigem + ' pra ' + contaDestino + '?\n\nProduto: ' + gap.marca + ' ' + gap.sku + '\nQuantidade: ' + gap.unidades + ' un\n\nO anúncio será criado PAUSADO — você revisa e ativa manualmente.')) return;

        setAnunciosClonando(chave + '|' + contaDestino);
        fetch('https://pylkufhziohxvwbbaued.supabase.co/functions/v1/ml-clonar-anuncio', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            conta_origem: contaOrigem,
            item_id_origem: itemIdOrigem,
            conta_destino: contaDestino,
            unidades: gap.unidades
          })
        })
          .then(function(resp) { return resp.json().then(function(dados) { return {ok: resp.ok, dados: dados}; }); })
          .then(function(r) {
            setAnunciosClonando(null);
            setAnunciosResultados(function(prev) {
              var novo = Object.assign({}, prev);
              novo[chave + '|' + contaDestino] = r.ok
                ? {ok: true, item_id: r.dados.item_id, permalink: r.dados.permalink}
                : {ok: false, erro: motivoDaFalha(r.dados)};
              return novo;
            });
          })
          .catch(function() {
            setAnunciosClonando(null);
            setAnunciosResultados(function(prev) {
              var novo = Object.assign({}, prev);
              novo[chave + '|' + contaDestino] = {ok: false, erro: 'Falha de conexão. Tente novamente.'};
              return novo;
            });
          });
      }

      // seller_sku do ML vem no formato "MARCA: SKU" — separa os dois pra bater com a tabela estoque
      function parseSellerSku(sellerSku) {
        if (!sellerSku) return null;
        var partes = sellerSku.split(':');
        if (partes.length < 2) return null;
        return { marca: partes[0].trim().toUpperCase(), sku: partes.slice(1).join(':').trim().toUpperCase() };
      }

      // Kit vem como "KIT: MARCA1: SKU1 + MARCA2: SKU2 + ..." — cada componente sai 1 unidade
      // (multiplicada pela quantidade vendida do kit). Retorna uma lista de {marca, sku}.
      function parseComponentesSku(sellerSku) {
        if (!sellerSku) return [];
        if (/^\s*KIT\s*:/i.test(sellerSku)) {
          var resto = sellerSku.replace(/^\s*KIT\s*:\s*/i, '');
          return resto.split('+').map(function(parte) { return parseSellerSku(parte.trim()); }).filter(Boolean);
        }
        var unico = parseSellerSku(sellerSku);
        return unico ? [unico] : [];
      }

      // Retorna uma Promise (não mexe em mlBaixandoId sozinha) pra poder ser encadeada
      // depois da etiqueta no fluxo combinado, e também usada isoladamente se precisar.
      function darBaixaPedidoPromise(pedido) {
        var itens = pedido.itens || [];
        var naoEncontrados = [];

        var buscas = [];
        itens.forEach(function(it) {
          var componentes = parseComponentesSku(it.item && it.item.seller_sku);
          if (componentes.length === 0) { naoEncontrados.push((it.item && it.item.seller_sku) || '(sem SKU)'); return; }
          componentes.forEach(function(parsed) {
            buscas.push(
              supabase.from('estoque').select('id, unidades, marca, sku').eq('marca', parsed.marca).eq('sku', parsed.sku).maybeSingle()
                .then(function(result) {
                  if (!result.data) { naoEncontrados.push(parsed.marca + ': ' + parsed.sku); return null; }
                  return { registro: result.data, quantidade: it.quantity || 1 };
                })
            );
          });
        });

        return Promise.all(buscas).then(function(encontrados) {
          var validos = encontrados.filter(function(x) { return x; });
          var updates = validos.map(function(v) {
            var novaQtd = Math.max(0, v.registro.unidades - v.quantidade);
            return supabase.from('estoque').update({unidades: novaQtd}).eq('id', v.registro.id);
          });
          return Promise.all(updates).then(function() {
            return supabase.from('ml_pedidos').update({processado: true}).eq('id', pedido.id).then(function(result) {
              if (result.error) { alert('Erro ao marcar pedido como processado.'); return; }
              if (naoEncontrados.length > 0) {
                alert('Baixa dada, mas os seguintes SKUs não foram encontrados no estoque e precisam de ajuste manual:\n' + naoEncontrados.join('\n'));
              }
              setMlPedidos(function(prev) { return prev.filter(function(p) { return p.id !== pedido.id; }); });
              carregarEstoque();
            });
          });
        });
      }

      function ignorarPedidoML(pedido) {
        if (!confirm('Marcar este pedido como processado SEM dar baixa no estoque?')) return;
        supabase.from('ml_pedidos').update({processado: true}).eq('id', pedido.id).then(function(result) {
          if (result.error) { alert('Erro ao ignorar pedido.'); return; }
          setMlPedidos(function(prev) { return prev.filter(function(p) { return p.id !== pedido.id; }); });
        });
      }

      // Manda o texto ZPL direto pra Zebra via Browser Print (programa local instalado no PC
      // da expedição, escuta em localhost:9100). Sem isso instalado/aberto, a promise rejeita.
      function enviarParaZebra(zpl) {
        return fetch('http://localhost:9100/default?type=printer')
          .then(function(resp) {
            if (!resp.ok) throw new Error('Browser Print não respondeu');
            return resp.json();
          })
          .then(function(device) {
            if (!device || (!device.name && !device.uid)) {
              throw new Error('Browser Print está rodando, mas não achou nenhuma impressora Zebra configurada. Confira se ela está ligada e conectada por USB.');
            }
            return fetch('http://localhost:9100/write', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({device: device, data: zpl})
            }).then(function(resp) {
              return resp.text().then(function(corpo) {
                if (!resp.ok) throw new Error('Impressora recusou a etiqueta: ' + (corpo || ('HTTP ' + resp.status)));
              });
            });
          });
      }

      // Busca a etiqueta em formato térmico (já vem com a DANFE simplificada junto, quando
      // aplicável) e manda direto pra Zebra via Browser Print. Só dá baixa no estoque se a
      // impressão realmente sair — se a etiqueta falhar (NF-e pendente, buffer do ML, Browser
      // Print não encontrado etc), a baixa NÃO acontece e o pedido fica intacto na fila.
      // Versão que retorna Promise (não mexe em mlBaixandoId sozinha), pra poder ser
      // encadeada na impressão em lote. `silencioso` evita popup de alert por pedido
      // quando está imprimindo vários de uma vez (junta tudo num resumo no final).
      function imprimirEtiquetaEDarBaixaPromise(pedido, silencioso) {
        if (!pedido.shipping_id) return Promise.resolve({ok: false, motivo: 'Etiqueta ainda não disponível'});
        return fetch('https://pylkufhziohxvwbbaued.supabase.co/functions/v1/ml-etiqueta?pedido=' + pedido.ml_order_id)
          .then(function(resp) {
            if (resp.ok) {
              return resp.json().then(function(dados) {
                return enviarParaZebra(dados.zpl).then(function() {
                  return darBaixaPedidoPromise(pedido);
                }).then(function() {
                  return {ok: true};
                });
              });
            }
            return resp.json().then(function(dados) {
              var motivo = dados.erro || 'Não foi possível gerar a etiqueta.';
              if (!silencioso) alert(motivo + '\n\nO estoque NÃO foi baixado — corrija o motivo acima e tente de novo.');
              return {ok: false, motivo: motivo};
            });
          })
          .catch(function(err) {
            var motivo = 'Não consegui mandar a etiqueta pra Zebra (' + (err && err.message ? err.message : 'falha de conexão') + ').';
            if (!silencioso) alert(motivo + ' Verifique se o programa "Zebra Browser Print" está aberto neste computador. O estoque NÃO foi baixado.');
            return {ok: false, motivo: motivo};
          });
      }

      function imprimirEtiquetaEDarBaixa(pedido) {
        setMlBaixandoId(pedido.id);
        imprimirEtiquetaEDarBaixaPromise(pedido, false).finally(function() { setMlBaixandoId(null); });
      }

      function toggleSelecaoPedido(pedidoId) {
        setMlSelecionados(function(prev) {
          var novo = Object.assign({}, prev);

          return novo;
        });

      // Imprime + dá baixa em todos os pedidos marcados, UM DE CADA VEZ (a Zebra só imprime
      // um trabalho por vez, e assim cada baixa fica isolada da anterior). No final mostra um
      // resumo único: quantos deram certo e quais falharam (e por quê), em vez de um alerta
      // por pedido.
      function imprimirSelecionadosEmLote() {
        var idsSelecionados = Object.keys(mlSelecionados).filter(function(id) { return mlSelecionados[id]; });
        var pedidosSelecionados = mlPedidos.filter(function(p) { return idsSelecionados.indexOf(String(p.id)) !== -1; });
        if (pedidosSelecionados.length === 0) return;

        setMlImprimindoLote(true);
        var resultados = [];
        var promise = Promise.resolve();
        pedidosSelecionados.forEach(function(pedido) {
          promise = promise.then(function() {
            return imprimirEtiquetaEDarBaixaPromise(pedido, true).then(function(r) {
              resultados.push({pedido: pedido, resultado: r});
            });
          });
        });
        promise.then(function() {
          var certos = resultados.filter(function(r) { return r.resultado.ok; });
          var falhas = resultados.filter(function(r) { return !r.resultado.ok; });
          var msg = '✅ ' + certos.length + ' impressa(s) e baixada(s) com sucesso.';
          if (falhas.length > 0) {
            msg += '\n\n⚠ ' + falhas.length + ' falharam:\n' + falhas.map(function(f) {
              return '#' + f.pedido.ml_order_id + ': ' + f.resultado.motivo;
            }).join('\n');
          }
          alert(msg);
          setMlSelecionados({});
          setMlImprimindoLote(false);
        });
      }

        // Recarrega o kanban com debounce: várias mudanças seguidas (ex: reordenar 10 cartões)
        // viram UMA recarga só, e nunca no meio de um drag (evita o board "pular" enquanto arrasta)
        function recarregarKanbanDebounced() {

          .on('postgres_changes', {event: '*', schema: 'public', table: 'kanban_cartoes'}, recarregarKanbanDebounced)

      function importarSKUsExcel(file) {
        setImporting(true);
        var reader = new FileReader();
        reader.onload = function(e) {
          try {
            var data = new Uint8Array(e.target.result);
            var workbook = XLSX.read(data, {type: 'array'});
            var skusDaPlanilha = [];

            workbook.SheetNames.forEach(function(sheetName) {
              var marca = sheetName.trim().toUpperCase();
              var sheet = workbook.Sheets[sheetName];
              var rows = XLSX.utils.sheet_to_json(sheet, {header: 1});

              // Encontra a linha de cabeçalho: primeira linha onde col A é "SKU"
              var dataStart = 1; // padrão: pula só a linha 0
              for (var i = 0; i < Math.min(rows.length, 10); i++) {
                if (rows[i][0] && String(rows[i][0]).trim().toUpperCase() === 'SKU') {
                  dataStart = i + 1;
                  break;
                }
              }

              rows.slice(dataStart).forEach(function(row) {
                if (!row[0]) return;
                var sku = String(row[0]).trim().toUpperCase();
                if (!sku) return;

                var temQtd = row[1] !== null && row[1] !== undefined && row[1] !== '';
                var temCusto = row[2] !== null && row[2] !== undefined && row[2] !== '';

                skusDaPlanilha.push({
                  marca: marca, sku: sku,
                  unidades: temQtd ? (parseInt(row[1]) || 0) : null,
                  custo: temCusto ? (parseFloat(String(row[2]).replace(',', '.')) || 0) : null,
                  temQtd: temQtd, temCusto: temCusto
                });
              });
            });

            if (skusDaPlanilha.length === 0) {
              alert('Nenhum SKU encontrado no arquivo.');
              setImporting(false);
              return;
            }

            // Remove duplicatas
            var deduped = {};
            skusDaPlanilha.forEach(function(item) { deduped[item.marca + '|' + item.sku] = item; });
            var skusUnicos = Object.keys(deduped).map(function(k) { return deduped[k]; });

            var existentesEstoque = estoque.map(function(x) {
              return { id: x.id, marca: (x.marca||'').toUpperCase(), sku: (x.sku||'').toUpperCase() };
            });

            var opsEstoque = [];
            var paraUpsertPrecos = [];
            var inseridosEstoque = 0, atualizadosEstoque = 0;

            skusUnicos.forEach(function(item) {
              if (item.temQtd) {
                var found = existentesEstoque.find(function(x) { return x.marca === item.marca && x.sku === item.sku; });
                if (found) {
                  opsEstoque.push(supabase.from('estoque').update({ unidades: item.unidades }).eq('id', found.id));
                  atualizadosEstoque++;
                } else {
                  opsEstoque.push(supabase.from('estoque').insert([{ marca: item.marca, sku: item.sku, unidades: item.unidades }]));
                  inseridosEstoque++;
                }
              }
              if (item.temCusto) {
                paraUpsertPrecos.push({ marca: item.marca, sku: item.sku, custo: item.custo });
              }
            });

            // Upsert preços em lotes de 500
            var opsPrecos = [];
            var chunkSize = 500;
            for (var ci = 0; ci < paraUpsertPrecos.length; ci += chunkSize) {
              opsPrecos.push(
                supabase.from('precos').upsert(paraUpsertPrecos.slice(ci, ci + chunkSize), { onConflict: 'marca,sku', ignoreDuplicates: false })
              );
            }

            var todasOps = opsEstoque.concat(opsPrecos);
            if (todasOps.length === 0) {
              alert('Nenhuma alteração para aplicar.');
              setImporting(false);
              return;
            }

            Promise.all(todasOps).then(function(results) {
              var err = results.find(function(r) { return r && r.error; });
              if (err) {
                alert('Erro na importação: ' + err.error.message);
                setImporting(false);
                return;
              }
              var msg = '✓ Importação concluída! ' + skusUnicos.length + ' SKUs processados.\n';
              if (inseridosEstoque > 0 || atualizadosEstoque > 0)
                msg += 'Estoque: ' + inseridosEstoque + ' inseridos, ' + atualizadosEstoque + ' atualizados\n';
              if (paraUpsertPrecos.length > 0)
                msg += 'Preços: ' + paraUpsertPrecos.length + ' custos salvos';
              alert(msg);
              carregarEstoque();
              if (paraUpsertPrecos.length > 0) carregarPrecos();
              setImporting(false);
            });
          } catch (err) {
            alert('Erro ao processar arquivo: ' + err.message);
            setImporting(false);
          }
        };
        reader.readAsArrayBuffer(file);
      }

      function importarVendas(file) {
        var nomeLoja = file.name.replace(/\.[^.]+$/, '').toUpperCase();
        var reader = new FileReader();
        reader.onload = function(e) {
          try {
            var data = new Uint8Array(e.target.result);
            var wb = XLSX.read(data, {type: 'array'});
            var sheetName = wb.SheetNames.find(function(n) { return n.toLowerCase().indexOf('venda') !== -1; }) || wb.SheetNames[0];
            var rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header: 1, defval: ''});

            // Encontra linha de cabeçalho (tem "SKU" em alguma coluna)
            var headerIdx = -1;
            var colSku = -1, colTotal = -1, colUnidades = -1;
            for (var i = 0; i < Math.min(rows.length, 10); i++) {
              var row = rows[i];
              for (var j = 0; j < row.length; j++) {
                var val = String(row[j]).trim().toUpperCase();
                if (val === 'SKU') { colSku = j; headerIdx = i; }
                if (val === 'TOTAL (BRL)') colTotal = j;
                if (val === 'UNIDADES') colUnidades = j;
              }
              if (headerIdx !== -1) break;
            }
            if (colSku === -1) { alert('Coluna SKU não encontrada na planilha ' + nomeLoja); return; }
            if (colTotal === -1) colTotal = 17;
            if (colUnidades === -1) colUnidades = 6;

            // Agrupa por SKU
            var grupos = {};
            rows.slice(headerIdx + 1).forEach(function(row) {
              var skuRaw = String(row[colSku] || '').trim();
              if (!skuRaw) return;
              var total = parseFloat(row[colTotal]) || 0;
              if (total <= 0) return;
              var chave = nomeLoja + '||' + skuRaw;
              if (!grupos[chave]) grupos[chave] = { loja: nomeLoja, skuRaw: skuRaw, count: 0, receitaTotal: 0 };
              grupos[chave].count++;
              grupos[chave].receitaTotal += total;
            });

            var novosCards = Object.keys(grupos).map(function(k) { return grupos[k]; });

            setVendasData(function(prev) {
              // Remove registros anteriores dessa loja e adiciona novos
              var semLoja = prev.filter(function(x) { return x.loja !== nomeLoja; });
              return semLoja.concat(novosCards);
            });
          } catch(err) {
            alert('Erro ao ler planilha de vendas ' + nomeLoja + ': ' + err.message);
          }
        };
        reader.readAsArrayBuffer(file);
      }

      function normStr(s) {
        return String(s).toUpperCase().replace(/\s+/g, '').replace(/[^A-Z0-9]/g, '');
      }

      function parseSKUsML(celula) {
        var result = [];
        if (!celula) return result;
        var texto = String(celula).trim().toUpperCase();
        // Remove leading KIT: prefix
        texto = texto.replace(/^KIT:\s*/i, '');
        // Split by + (multiple items in kit)
        var partes = texto.split('+');
        var ultimaMarca = '';
        partes.forEach(function(parte) {
          parte = parte.trim();
          // Remove quantity suffix like "- 2UN", "- 3UN" etc
          parte = parte.replace(/\s*-\s*\d+\s*UN\s*$/i, '').trim();
          if (!parte) return;
          if (parte.indexOf(':') !== -1) {
            var idx = parte.indexOf(':');
            var marcaRaw = parte.substring(0, idx).trim();
            var skuRaw = parte.substring(idx + 1).trim();
            if (marcaRaw && skuRaw) {
              ultimaMarca = marcaRaw;
              result.push({ marca: normStr(marcaRaw), sku: normStr(skuRaw) });
            }
          } else if (parte && ultimaMarca) {
            // No marca prefix — use last seen marca
            result.push({ marca: normStr(ultimaMarca), sku: normStr(parte) });
          }
        });
        return result;
      }

      function carregarPrecos() {

          supabase.from('precos').select('*').order('marca').order('sku').range(from, from + batchSize - 1).then(function(result) {
            if (result.error || !result.data) return;
            allData = allData.concat(result.data);
            if (result.data.length === batchSize) {
              fetchBatch(from + batchSize);
            } else {
              setPrecos(allData);
            }
          });
        }
        fetchBatch(0);
      }

      // ===== Motor de drag estilo Trello =====
      // Segurar e mover (>6px) = arrastar (clone segue o mouse, placeholder mostra onde cai).
      // Soltar sem mover = clique normal (abre/edita).
      function kDragComecar(ev, cfg) {
        if (ev.button !== 0) return;
        if (ev.target.closest && ev.target.closest('input, button, textarea, select, a')) return;
        var alvo = cfg.elemento || ev.currentTarget;
        var startX = ev.clientX, startY = ev.clientY;
        var rect = alvo.getBoundingClientRect();
        var iniciou = false;
        function aoMover(mev) {
          var dx = mev.clientX - startX, dy = mev.clientY - startY;
          if (!iniciou && (dx * dx + dy * dy) > 36) {
            iniciou = true;
            window._kDragAtivo = true;
            var clone = alvo.cloneNode(true);
            clone.style.position = 'fixed';
            clone.style.left = rect.left + 'px';
            clone.style.top = rect.top + 'px';
            clone.style.width = rect.width + 'px';
            clone.style.height = rect.height + 'px';
            clone.style.zIndex = '9999';
            clone.style.pointerEvents = 'none';
            clone.style.transform = 'rotate(3deg)';
            clone.style.boxShadow = '0 16px 32px rgba(0,0,0,0.5)';
            clone.style.opacity = '0.95';
            document.body.appendChild(clone);
            window._kClone = clone;
            window._kCloneBase = {left: rect.left, top: rect.top};
            document.body.style.userSelect = 'none';
            document.body.style.cursor = 'grabbing';
            setKdrag({tipo: cfg.tipo, id: cfg.id, h: rect.height, w: rect.width});
          }
          if (iniciou) {
            window._kClone.style.left = (window._kCloneBase.left + dx) + 'px';
            window._kClone.style.top = (window._kCloneBase.top + dy) + 'px';
            var drop = cfg.calcularDrop(mev.clientX, mev.clientY);
            var prevDrop = window._kDrop;
            if (JSON.stringify(prevDrop) !== JSON.stringify(drop)) {
              window._kDrop = drop;
              setKdrop(drop);
            }
          }
        }
        function aoSoltar() {
          document.removeEventListener('mousemove', aoMover);
          document.removeEventListener('mouseup', aoSoltar);
          if (iniciou) {
            if (window._kClone) { window._kClone.remove(); window._kClone = null; }
            document.body.style.userSelect = '';
            document.body.style.cursor = '';
            var drop = window._kDrop;
            window._kDrop = null;
            window._kDragAtivo = false;
            setKdrag(null);
            setKdrop(null);
            if (drop) cfg.aoSoltar(drop);
          } else if (cfg.aoClicar) {
            cfg.aoClicar();
          }
        }
        document.addEventListener('mousemove', aoMover);
        document.addEventListener('mouseup', aoSoltar);
      }

      function calcularDropCartao(x, y, cartaoId) {
        var colunas = document.querySelectorAll('[data-klista]');
        var melhor = null, melhorDist = Infinity;
        colunas.forEach(function(col) {
          var r = col.getBoundingClientRect();
          var dist = (x >= r.left && x <= r.right) ? 0 : Math.min(Math.abs(x - r.left), Math.abs(x - r.right));
          if (dist < melhorDist) { melhorDist = dist; melhor = col; }
        });
        if (!melhor) return null;
        var listaId = melhor.getAttribute('data-klista');
        var cards = melhor.querySelectorAll('[data-kcartao]');
        var index = 0;
        for (var i = 0; i < cards.length; i++) {
          if (cards[i].getAttribute('data-kcartao') === String(cartaoId)) continue;
          var cr = cards[i].getBoundingClientRect();
          if (y > cr.top + cr.height / 2) index++;
        }
        return {listaId: listaId, index: index};
      }

      function calcularDropLista(x) {
        var colunas = document.querySelectorAll('[data-klista]');
        var index = 0;
        colunas.forEach(function(col) {
          if (col.getAttribute('data-kdragging') === '1') return;
          var r = col.getBoundingClientRect();
          if (x > r.left + r.width / 2) index++;
        });
        return {index: index};
      }

      function calcularDropItem(y) {
        var linhas = document.querySelectorAll('[data-kitem]');
        var antesDeId = null;
        for (var i = 0; i < linhas.length; i++) {
          if (linhas[i].getAttribute('data-kdragging') === '1') continue;
          var r = linhas[i].getBoundingClientRect();
          if (y < r.top + r.height / 2) { antesDeId = linhas[i].getAttribute('data-kitem'); break; }
        }
        return {antesDeId: antesDeId};
      }

      function moverCartaoIdx(cartaoId, destListaId, destIndex) {
        var cartao = kanbanCartoes.find(function(c) { return c.id === cartaoId; });
        if (!cartao) return;
        var srcListaId = cartao.lista_id;
        var dest = kanbanCartoes.filter(function(c) { return c.lista_id === destListaId && c.id !== cartaoId; })
          .sort(function(a, b) { return a.ordem - b.ordem; });
        var idx = Math.max(0, Math.min(destIndex == null ? dest.length : destIndex, dest.length));
        dest.splice(idx, 0, Object.assign({}, cartao, {lista_id: destListaId}));
        var atualizados = dest.map(function(c, i) { return Object.assign({}, c, {ordem: i}); });
        if (srcListaId !== destListaId) {
          var src = kanbanCartoes.filter(function(c) { return c.lista_id === srcListaId && c.id !== cartaoId; })
            .sort(function(a, b) { return a.ordem - b.ordem; });
          atualizados = atualizados.concat(src.map(function(c, i) { return Object.assign({}, c, {ordem: i}); }));
        }
        var mudados = atualizados.filter(function(c) {
          var antigo = kanbanCartoes.find(function(x) { return x.id === c.id; });
          return !antigo || antigo.ordem !== c.ordem || antigo.lista_id !== c.lista_id;
        });
        if (mudados.length === 0) return;
        setKanbanCartoes(function(prev) {
          return prev.map(function(c) {
            var u = mudados.find(function(x) { return x.id === c.id; });
            return u || c;
          }).sort(function(a, b) { return a.ordem - b.ordem; });
        });
        mudados.forEach(function(c) {
          supabase.from('kanban_cartoes').update({lista_id: c.lista_id, ordem: c.ordem}).eq('id', c.id).then(function() {});
        });
      }

      function parseKitComponentesML(skuString) {
        var result = [];
        var texto = String(skuString).trim().toUpperCase().replace(/^KIT:\s*/i, '');
        var partes = texto.split('+');
        var ultimaMarca = '';
        partes.forEach(function(parte) {
          parte = parte.trim();
          var qtdMatch = parte.match(/\s*-\s*(\d+)\s*UN\s*$/i);
          var quantidade = qtdMatch ? parseInt(qtdMatch[1]) : 1;
          parte = parte.replace(/\s*-\s*\d+\s*UN\s*$/i, '').trim();
          if (!parte) return;
          if (parte.indexOf(':') !== -1) {
            var idx = parte.indexOf(':');
            var marcaRaw = parte.substring(0, idx).trim();
            var skuRaw  = parte.substring(idx + 1).trim();
            var skuN = normStr(skuRaw);
            if (marcaRaw && skuN && skuN.length >= 2 && skuN.length <= 25) {
              ultimaMarca = marcaRaw;
              result.push({ marca: normStr(marcaRaw), sku: skuN, skuOriginal: skuRaw.trim(), quantidade: quantidade });
            }
          } else if (parte && ultimaMarca) {
            var s = normStr(parte);
            if (s && s.length >= 2 && s.length <= 25)
              result.push({ marca: normStr(ultimaMarca), sku: s, skuOriginal: parte.trim(), quantidade: quantidade });
          }
        });
        return result;
      }

      var fazendoBackupState = useState(false);
      var fazendoBackup = fazendoBackupState[0];
      var setFazendoBackup = fazendoBackupState[1];

      function backupCompleto() {
        if (fazendoBackup) return;
        setFazendoBackup(true);
        // Busca TODAS as tabelas frescas do banco (não depende do que está na tela)
        function puxarTudo(tabela) {
          var batch = 1000, acc = [];
          function ler(from) {
            return supabase.from(tabela).select('*').range(from, from + batch - 1).then(function(r) {
              if (r.error) throw new Error(tabela + ': ' + r.error.message);
              acc = acc.concat(r.data || []);
              if ((r.data || []).length === batch) return ler(from + batch);
              return acc;
            });
          }
          return ler(0);
        }

            var ws = wb.Sheets[wb.SheetNames[0]];
            var rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

            // Pula cabeçalho (linha 0) e lê as demais
            var entries = [];
            for (var i = 1; i < rows.length; i++) {
              var row = rows[i];
              var marca = normStr(String(row[0] || ''));
              var sku   = normStr(String(row[1] || ''));
              var qty   = parseInt(row[2]) || 0;
              if (marca && sku && qty > 0) {
                entries.push({ marca: marca, sku: sku, qty: qty });
              }
            }

            if (entries.length === 0) {

              setImporting(false);
              return;

            var dbItems = estoque.map(function(x) {

            });

            var changeMap = {};

            entries.forEach(function(entry) {

              if (!dbItem) dbItem = dbItems.find(function(d) { return d.sku === entry.sku; });

              if (dbItem) {
                if (changeMap[dbItem.id]) {
                  changeMap[dbItem.id].baixa += entry.qty;
                  changeMap[dbItem.id].novoEstoque = Math.max(0, changeMap[dbItem.id].estoqueAtual - changeMap[dbItem.id].baixa);

              }

            var changes = Object.keys(changeMap).map(function(k) { return changeMap[k]; });
            setPendingChanges({ changes: changes, naoEncontrados: naoEncontrados });
            setImporting(false);
          } catch(err) {

            setImporting(false);
