    function getCorContaML(conta) {
      var c = (conta || '').toUpperCase();
      if (c.indexOf('KMP') !== -1) return 'bg-blue-900 text-blue-300';
      if (c.indexOf('ERP') !== -1) return 'bg-orange-900 text-orange-300';
      if (c.indexOf('LTS') !== -1) return 'bg-green-900 text-green-300';
      return 'bg-slate-700 text-slate-300';
    }

    var LOJA_CORES_FALLBACK = [
      {bg: 'bg-blue-500',   text: 'text-white'},
      {bg: 'bg-orange-500', text: 'text-white'},
      {bg: 'bg-yellow-400', text: 'text-gray-900'},
      {bg: 'bg-purple-500', text: 'text-white'},
      {bg: 'bg-teal-500',   text: 'text-white'}
    ];

    function getCorLoja(nome, idx) {
      var n = (nome || '').toUpperCase();
      if (n.indexOf('KMP') !== -1 || n.indexOf('KARMA') !== -1)
        return {bg: 'bg-blue-500', text: 'text-white'};
      if (n.indexOf('ERP') !== -1 || n.indexOf('ERUP') !== -1)
        return {bg: 'bg-orange-500', text: 'text-white'};
      if (n.indexOf('LOT') !== -1 || n.indexOf('LTS') !== -1)
        return {bg: 'bg-yellow-400', text: 'text-gray-900'};
      return LOJA_CORES_FALLBACK[idx % LOJA_CORES_FALLBACK.length];
    }

    function tempoRelativo(ts) {
      var diff = Date.now() - new Date(ts).getTime();
      var min = Math.floor(diff / 60000);
      if (min < 1) return 'agora';
      if (min < 60) return 'há ' + min + ' min';
      var h = Math.floor(min / 60);
      if (h < 24) return 'há ' + h + ' h';
      var d = Math.floor(h / 24);
      return 'há ' + d + (d > 1 ? ' dias' : ' dia');
    }

    function SKUCard(props) {
      var item = props.item;
      var lojas = props.lojas || [];
      var isZerado = item.unidades === 0;
      var borderColor = isZerado ? 'border-l-4 border-red-400 bg-red-50' : 'border-l-4 border-green-400 bg-green-50';
      var badgeColor = isZerado ? 'bg-red-200 text-red-800' : 'bg-green-200 text-green-800';
      var inputId = 'qty-' + item.id;

      // Quais lojas têm esse SKU anunciado
      var mk = item.marca ? item.marca.toUpperCase().replace(/\s+/g, '').replace(/[^A-Z0-9]/g, '') : '';
      var sk = item.sku   ? item.sku.toUpperCase().replace(/\s+/g, '').replace(/[^A-Z0-9]/g, '')   : '';
      var lojasAnunciadas = lojas.filter(function(l) { return l.skuSet && l.skuSet[mk + '|' + sk]; });

      return e('div', {className: borderColor + ' p-4 rounded-lg text-gray-800 shadow'},
        // Linha superior: marca/SKU à esquerda, badges + x à direita
        e('div', {className: 'flex justify-between items-start mb-2'},
          e('div', null,
            e('div', {className: 'text-xs text-gray-500 font-semibold uppercase'}, item.marca),
            e('div', {className: 'text-lg font-bold text-gray-900'}, item.sku)
          ),

            lojasAnunciadas.map(function(loja) {
              var cor = getCorLoja(loja.nome, loja.idx);
              return e('span', {
                key: loja.nome,
                className: cor.bg + ' ' + cor.text + ' px-2 py-0.5 rounded text-xs font-bold'
              }, loja.nome);
            }),
            e('button', {
              onClick: function() { props.onDelete(item); },
              className: 'w-6 h-6 flex items-center justify-center hover:bg-red-200 rounded-full text-red-600 font-bold text-sm ml-1'
            }, 'x')
          )
        ),
        e('div', {className: 'mb-3'},
          e('span', {className: badgeColor + ' px-3 py-1 rounded-full text-sm font-bold'},
            isZerado ? 'ZERADO' : item.unidades + ' un'
          )
        ),
        e('div', {className: 'flex gap-2'},
          e('input', {
            type: 'number',
            id: inputId,
            placeholder: '0',
            min: '0',
            className: 'w-20 px-2 py-1 border border-gray-300 rounded text-sm text-gray-800 bg-white'
          }),
          e('button', {
            onClick: function() {
              var qty = parseInt(document.getElementById(inputId).value) || 0;
              if (qty > 0) props.onSaida(item, qty);
              document.getElementById(inputId).value = '';
            },
            className: 'flex-1 bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded font-bold text-sm transition'
          }, 'SAIDA'),
          e('button', {
            onClick: function() {
              var qty = parseInt(document.getElementById(inputId).value) || 0;
              if (qty > 0) props.onEntrada(item, qty);
              document.getElementById(inputId).value = '';

          }, 'ENTRADA')

        setPerfilSel(perfil);
        setSenha('');
        setSenha2('');
        setErro('');
        setCarregando(true);
        supabase.from('app_perfis').select('senha').eq('perfil', perfil).single().then(function(res) {
          setCarregando(false);
          setSenhaAtualBd(res.data ? res.data.senha : null);
        });
      }

      function confirmar() {
        if (senhaAtualBd) {
          if (senha !== senhaAtualBd) { setErro('Senha incorreta.'); return; }
          props.onEntrar(perfilSel);
        } else {
          if (senha.length < 4) { setErro('A senha precisa ter pelo menos 4 caracteres.'); return; }
          if (senha !== senha2) { setErro('As senhas não coincidem.'); return; }
          setCarregando(true);
          supabase.from('app_perfis').update({ senha: senha }).eq('perfil', perfilSel).then(function() {
            setCarregando(false);
            props.onEntrar(perfilSel);
          });
        }
      }

            erro && e('div', {className: 'text-red-400 text-xs'}, erro),
            e('div', {className: 'flex gap-2'},

              }, senhaAtualBd == null ? 'Criar e entrar' : 'Entrar')
            )
          )
        )
      );
    }

      function formatarMoedaDigitando(valorDigitado) {
        var digitos = valorDigitado.replace(/\D/g, '');
        if (!digitos) return '';
        digitos = digitos.replace(/^0+(?=\d)/, '');
        while (digitos.length < 3) digitos = '0' + digitos;
        var centavos = digitos.slice(-2);
        var inteiro = digitos.slice(0, -2).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        return inteiro + ',' + centavos;
      }

            .order('sku', {ascending: true})
            .range(from, from + batchSize - 1)
            .then(function(result) {
              if (result.error) throw result.error;
              var data = result.data || [];
              allData = allData.concat(data);
              if (data.length === batchSize) return fetchBatch(from + batchSize);
              return allData;
            });
        }

        fetchBatch(0).then(function(data) {
          setEstoque(data);
          var total = data.length;
          var totalUnidades = data.reduce(function(sum, item) { return sum + (item.unidades || 0); }, 0);
          var zerados = data.filter(function(item) { return item.unidades === 0; }).length;
          setStats({total: total, unidades: totalUnidades, zerados: zerados});
          setLoading(false);

      // ── Robô: fila de tarefas ────────────────────────────────────────────────
      //
      // Por que existe uma fila: a ação de tirar do Full só funciona com a sessão
      // de navegador logada, que vive no PC do Matheus. O site não tem acesso a
      // isso. Então o site escreve a tarefa aqui e o robô, rodando lá, executa.
      // Se o PC estiver desligado, a tarefa espera — nada se perde.

      // O robô bate ponto a cada minuto. Se a última batida foi há mais de 3
      // minutos, consideramos que ele não está rodando.
      var ROBO_LIMITE_OFFLINE_MS = 3 * 60 * 1000;

      function roboEstaOnline(status) {
        if (!status || !status.ultima_batida) return false;
        return (Date.now() - new Date(status.ultima_batida).getTime()) < ROBO_LIMITE_OFFLINE_MS;
      }

      function carregarStatusRobo() {
        supabase.from('robo_status').select('*').eq('id', 1).maybeSingle()
          .then(function(r) { if (!r.error) setRoboStatus(r.data); });

        // Histórico: sem isto, a tela esquece o que aconteceu assim que atualiza.
        supabase.from('ml_log_acoes')
          .select('*').order('quando', { ascending: false }).limit(60)
          .then(function(r) { if (!r.error && r.data) setLogAcoes(r.data); });

        supabase.from('ml_tarefas_robo')
          .select('id, conta, tipo, params, status, erro, resultado, criado_em')
          .order('criado_em', { ascending: false })
          .limit(200)
          .then(function(r) {
            if (r.error || !r.data) return;
            var porItem = {};
            var emAndamento = 0;
            r.data.forEach(function(t) {
              if (t.status === 'pendente' || t.status === 'rodando') emAndamento++;
              var chave = t.params && t.params.item_id;
              // guarda só a tarefa mais recente de cada anúncio
              if (chave && !porItem[chave]) porItem[chave] = t;
            });
            setRoboTarefas(porItem);

            // Quando o robô esvazia a fila, a lista da tela fica velha: os concluídos
            // continuam aparecendo e você teria que atualizar a página na mão. Então,
            // assim que o último termina, refazemos a verificação sozinho.
            var tinhaTrabalho = window._roboEmAndamento > 0;
            window._roboEmAndamento = emAndamento;
            if (tinhaTrabalho && emAndamento === 0 && anunciosReativarResultado) {
              reativarAnunciosSemEstoque();
            }
          });
      }

      // Botão de pânico. Não mata o programa (o site não tem esse poder) — levanta uma
      // bandeira no banco que o robô consulta antes de pegar cada tarefa. Ele continua
      // vivo, só para de trabalhar até você retomar.
      function pararOuRetomarRobo() {
        var vaiParar = !(roboStatus && roboStatus.parar);
        if (vaiParar && !confirm('Parar o robô?\n\nEle deixa de executar tarefas até você retomar. As tarefas ficam esperando na fila, nada se perde.')) return;

        supabase.from('robo_status').update({ parar: vaiParar }).eq('id', 1).then(function(r) {
          if (r.error) { alert('Não consegui alterar: ' + r.error.message); return; }
          carregarStatusRobo();
        });
      }

      // Sem confirmação: se clicou no botão, é porque quer. A ação é reversível
      // (dá pra voltar a oferecer Full) e o estado aparece no próprio card.
      function enviarParaRobo(item, conta) {
        supabase.from('ml_tarefas_robo').insert({
          conta: conta,
          tipo: 'tirar_do_full',
          params: {
            item_id: item.item_id, title: item.title, sku_bruto: item.sku_bruto,
            // o que fazer depois de sair do Full: reativar vendendo, ou pausar pra inativos
            acao_depois: item.acao_depois || (item.tem_estoque ? 'ativar' : 'inativar')
          },
          criado_por: perfilAtivo || null
        }).then(function(r) {
          if (r.error) {
            // índice único impede enfileirar a mesma coisa duas vezes
            if (String(r.error.message || '').indexOf('duplicate') !== -1) {
              alert('Esse anúncio já está na fila do robô.');
            } else {
              alert('Não consegui enfileirar: ' + r.error.message);
            }
            return;
          }
          carregarStatusRobo();
        });
      }

      // Enfileira vários de uma vez. O robô continua executando um por um (ou em lote,
      // se conseguir), mas você clica uma vez só.
      function enviarTodosParaRobo(itens, conta) {
        if (!itens.length) return;
        var linhas = itens.map(function(item) {
          return {
            conta: conta,
            tipo: 'tirar_do_full',
            params: {
              item_id: item.item_id, title: item.title, sku_bruto: item.sku_bruto,
              acao_depois: item.acao_depois || (item.tem_estoque ? 'ativar' : 'inativar')
            },
            criado_por: perfilAtivo || null
          };
        });

        // ignoreDuplicates evita erro quando algum já está na fila
        supabase.from('ml_tarefas_robo').upsert(linhas, { ignoreDuplicates: true }).then(function(r) {
          if (r.error) { alert('Não consegui enfileirar: ' + r.error.message); return; }
          carregarStatusRobo();
        });
      }

      // Extrai o motivo REAL da recusa do Mercado Livre.
      //
      // A resposta de erro do ML vem com uma lista "cause" que mistura erros de verdade
      // com avisos inofensivos (atributos que ele simplesmente ignora). Só o que tem
      // type "error" impede a criação — o resto é ruído. Sem esse filtro, a mensagem
      // que aparecia era genérica e não dava pra saber o que consertar.
      function motivoDaFalha(dados) {
        var generico = (dados && dados.erro) || 'Falha ao clonar anúncio.';
        var causas = dados && dados.detalhe && dados.detalhe.cause;
        if (!Array.isArray(causas)) return generico;

        var erros = causas.filter(function(c) { return c && c.type === 'error'; });
        if (erros.length === 0) return generico;

        return erros.map(function(c) { return c.message || c.code; }).join(' · ');
      }

      function clonarAnuncio(gap, contaOrigem, contaDestino) {
        var chave = gap.marca + '|' + gap.sku;
        var itemIdOrigem = contaOrigem === 'KMP' ? gap.item_id_kmp : contaOrigem === 'ERP' ? gap.item_id_erp : gap.item_id_lts;
        if (!confirm('Clonar o anúncio da ' + contaOrigem + ' pra ' + contaDestino + '?\n\nProduto: ' + gap.marca + ' ' + gap.sku + '\nQuantidade: ' + gap.unidades + ' un\n\nO anúncio será criado PAUSADO — você revisa e ativa manualmente.')) return;

        setAnunciosClonando(chave + '|' + contaDestino);
        fetch('https://pylkufhziohxvwbbaued.supabase.co/functions/v1/ml-clonar-anuncio', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            conta_origem: contaOrigem,
            item_id_origem: itemIdOrigem,
            conta_destino: contaDestino,
            unidades: gap.unidades
          })
        })
          .then(function(resp) { return resp.json().then(function(dados) { return {ok: resp.ok, dados: dados}; }); })
          .then(function(r) {
            setAnunciosClonando(null);
            setAnunciosResultados(function(prev) {
              var novo = Object.assign({}, prev);
              novo[chave + '|' + contaDestino] = r.ok
                ? {ok: true, item_id: r.dados.item_id, permalink: r.dados.permalink}
                : {ok: false, erro: motivoDaFalha(r.dados)};
              return novo;
            });
          })
          .catch(function() {
            setAnunciosClonando(null);
            setAnunciosResultados(function(prev) {
              var novo = Object.assign({}, prev);
              novo[chave + '|' + contaDestino] = {ok: false, erro: 'Falha de conexão. Tente novamente.'};
              return novo;
            });
          });
      }

      // seller_sku do ML vem no formato "MARCA: SKU" — separa os dois pra bater com a tabela estoque
      function parseSellerSku(sellerSku) {
        if (!sellerSku) return null;
        var partes = sellerSku.split(':');
        if (partes.length < 2) return null;
        return { marca: partes[0].trim().toUpperCase(), sku: partes.slice(1).join(':').trim().toUpperCase() };
      }

      // Kit vem como "KIT: MARCA1: SKU1 + MARCA2: SKU2 + ..." — cada componente sai 1 unidade
      // (multiplicada pela quantidade vendida do kit). Retorna uma lista de {marca, sku}.
      function parseComponentesSku(sellerSku) {
        if (!sellerSku) return [];
        if (/^\s*KIT\s*:/i.test(sellerSku)) {
          var resto = sellerSku.replace(/^\s*KIT\s*:\s*/i, '');
          return resto.split('+').map(function(parte) { return parseSellerSku(parte.trim()); }).filter(Boolean);
        }
        var unico = parseSellerSku(sellerSku);
        return unico ? [unico] : [];
      }

      // Retorna uma Promise (não mexe em mlBaixandoId sozinha) pra poder ser encadeada
      // depois da etiqueta no fluxo combinado, e também usada isoladamente se precisar.
      function darBaixaPedidoPromise(pedido) {
        var itens = pedido.itens || [];
        var naoEncontrados = [];

        var buscas = [];
        itens.forEach(function(it) {
          var componentes = parseComponentesSku(it.item && it.item.seller_sku);
          if (componentes.length === 0) { naoEncontrados.push((it.item && it.item.seller_sku) || '(sem SKU)'); return; }
          componentes.forEach(function(parsed) {
            buscas.push(
              supabase.from('estoque').select('id, unidades, marca, sku').eq('marca', parsed.marca).eq('sku', parsed.sku).maybeSingle()
                .then(function(result) {
                  if (!result.data) { naoEncontrados.push(parsed.marca + ': ' + parsed.sku); return null; }
                  return { registro: result.data, quantidade: it.quantity || 1 };
                })
            );
          });
        });

        return Promise.all(buscas).then(function(encontrados) {
          var validos = encontrados.filter(function(x) { return x; });
          var updates = validos.map(function(v) {
            var novaQtd = Math.max(0, v.registro.unidades - v.quantidade);
            return supabase.from('estoque').update({unidades: novaQtd}).eq('id', v.registro.id);
          });
          return Promise.all(updates).then(function() {
            return supabase.from('ml_pedidos').update({processado: true}).eq('id', pedido.id).then(function(result) {
              if (result.error) { alert('Erro ao marcar pedido como processado.'); return; }
              if (naoEncontrados.length > 0) {
                alert('Baixa dada, mas os seguintes SKUs não foram encontrados no estoque e precisam de ajuste manual:\n' + naoEncontrados.join('\n'));
              }
              setMlPedidos(function(prev) { return prev.filter(function(p) { return p.id !== pedido.id; }); });
              carregarEstoque();
            });
          });
        });
      }

      function ignorarPedidoML(pedido) {
        if (!confirm('Marcar este pedido como processado SEM dar baixa no estoque?')) return;
        supabase.from('ml_pedidos').update({processado: true}).eq('id', pedido.id).then(function(result) {
          if (result.error) { alert('Erro ao ignorar pedido.'); return; }
          setMlPedidos(function(prev) { return prev.filter(function(p) { return p.id !== pedido.id; }); });
        });
      }

      // Manda o texto ZPL direto pra Zebra via Browser Print (programa local instalado no PC
      // da expedição, escuta em localhost:9100). Sem isso instalado/aberto, a promise rejeita.
      function enviarParaZebra(zpl) {
        return fetch('http://localhost:9100/default?type=printer')
          .then(function(resp) {
            if (!resp.ok) throw new Error('Browser Print não respondeu');
            return resp.json();
          })
          .then(function(device) {
            if (!device || (!device.name && !device.uid)) {
              throw new Error('Browser Print está rodando, mas não achou nenhuma impressora Zebra configurada. Confira se ela está ligada e conectada por USB.');
            }
            return fetch('http://localhost:9100/write', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({device: device, data: zpl})
            }).then(function(resp) {
              return resp.text().then(function(corpo) {
                if (!resp.ok) throw new Error('Impressora recusou a etiqueta: ' + (corpo || ('HTTP ' + resp.status)));
              });
            });
          });
      }

      // Busca a etiqueta em formato térmico (já vem com a DANFE simplificada junto, quando
      // aplicável) e manda direto pra Zebra via Browser Print. Só dá baixa no estoque se a
      // impressão realmente sair — se a etiqueta falhar (NF-e pendente, buffer do ML, Browser
      // Print não encontrado etc), a baixa NÃO acontece e o pedido fica intacto na fila.
      // Versão que retorna Promise (não mexe em mlBaixandoId sozinha), pra poder ser
      // encadeada na impressão em lote. `silencioso` evita popup de alert por pedido
      // quando está imprimindo vários de uma vez (junta tudo num resumo no final).
      function imprimirEtiquetaEDarBaixaPromise(pedido, silencioso) {
        if (!pedido.shipping_id) return Promise.resolve({ok: false, motivo: 'Etiqueta ainda não disponível'});
        return fetch('https://pylkufhziohxvwbbaued.supabase.co/functions/v1/ml-etiqueta?pedido=' + pedido.ml_order_id)
          .then(function(resp) {
            if (resp.ok) {
              return resp.json().then(function(dados) {
                return enviarParaZebra(dados.zpl).then(function() {
                  return darBaixaPedidoPromise(pedido);
                }).then(function() {
                  return {ok: true};
                });
              });
            }
            return resp.json().then(function(dados) {
              var motivo = dados.erro || 'Não foi possível gerar a etiqueta.';
              if (!silencioso) alert(motivo + '\n\nO estoque NÃO foi baixado — corrija o motivo acima e tente de novo.');
              return {ok: false, motivo: motivo};
            });
          })
          .catch(function(err) {
            var motivo = 'Não consegui mandar a etiqueta pra Zebra (' + (err && err.message ? err.message : 'falha de conexão') + ').';
            if (!silencioso) alert(motivo + ' Verifique se o programa "Zebra Browser Print" está aberto neste computador. O estoque NÃO foi baixado.');
            return {ok: false, motivo: motivo};
          });
      }

      function imprimirEtiquetaEDarBaixa(pedido) {
        setMlBaixandoId(pedido.id);
        imprimirEtiquetaEDarBaixaPromise(pedido, false).finally(function() { setMlBaixandoId(null); });
      }

      function toggleSelecaoPedido(pedidoId) {
        setMlSelecionados(function(prev) {

          return novo;

      // Imprime + dá baixa em todos os pedidos marcados, UM DE CADA VEZ (a Zebra só imprime
      // um trabalho por vez, e assim cada baixa fica isolada da anterior). No final mostra um
      // resumo único: quantos deram certo e quais falharam (e por quê), em vez de um alerta
      // por pedido.
      function imprimirSelecionadosEmLote() {
        var idsSelecionados = Object.keys(mlSelecionados).filter(function(id) { return mlSelecionados[id]; });
        var pedidosSelecionados = mlPedidos.filter(function(p) { return idsSelecionados.indexOf(String(p.id)) !== -1; });
        if (pedidosSelecionados.length === 0) return;

        setMlImprimindoLote(true);
        var resultados = [];
        var promise = Promise.resolve();
        pedidosSelecionados.forEach(function(pedido) {
          promise = promise.then(function() {
            return imprimirEtiquetaEDarBaixaPromise(pedido, true).then(function(r) {
              resultados.push({pedido: pedido, resultado: r});
            });
          });
        });
        promise.then(function() {
          var certos = resultados.filter(function(r) { return r.resultado.ok; });
          var falhas = resultados.filter(function(r) { return !r.resultado.ok; });
          var msg = '✅ ' + certos.length + ' impressa(s) e baixada(s) com sucesso.';
          if (falhas.length > 0) {
            msg += '\n\n⚠ ' + falhas.length + ' falharam:\n' + falhas.map(function(f) {
              return '#' + f.pedido.ml_order_id + ': ' + f.resultado.motivo;
            }).join('\n');
          }
          alert(msg);
          setMlSelecionados({});
          setMlImprimindoLote(false);
        });
      }

      function adicionarSKU() {
        var marca = novaMarca.trim().toUpperCase();
        var sku = novoSku.trim().toUpperCase();
        if (!marca || !sku) { alert('Preencha a Marca e o SKU!'); return; }
        var custo = parseFloat(String(novoCusto || '').replace(',', '.')) || 0;

        // Verifica se já existe em estoque e precos antes de inserir

          supabase.from('estoque').select('id').eq('sku', sku).maybeSingle(),
          supabase.from('precos').select('id').eq('marca', marca).eq('sku', sku).maybeSingle()
        ]).then(function(results) {
          var estoqueExiste = results[0].data;
          var precosExiste = results[1].data;
          var ops = [];

          if (!estoqueExiste) {
            ops.push(supabase.from('estoque').insert([{ marca: marca, sku: sku, unidades: novasUnidades }]));
          }

            ops.push(supabase.from('precos').insert([{ marca: marca, sku: sku, custo: custo }]));
          }

            if (!precosExiste) msgs.push('preços');

            setNovaMarca('');

      function fazerMovimento(item, quantidade, tipo) {

          ? item.unidades + quantidade
          : Math.max(0, item.unidades - quantidade);
        supabase.from('estoque').update({unidades: novaQtd}).eq('id', item.id).then(function(result) {

      function importarSKUsExcel(file) {
        setImporting(true);
        var reader = new FileReader();
        reader.onload = function(e) {
          try {
            var data = new Uint8Array(e.target.result);
            var workbook = XLSX.read(data, {type: 'array'});
            var skusDaPlanilha = [];

            workbook.SheetNames.forEach(function(sheetName) {
              var marca = sheetName.trim().toUpperCase();
              var sheet = workbook.Sheets[sheetName];
              var rows = XLSX.utils.sheet_to_json(sheet, {header: 1});

              // Encontra a linha de cabeçalho: primeira linha onde col A é "SKU"
              var dataStart = 1; // padrão: pula só a linha 0
              for (var i = 0; i < Math.min(rows.length, 10); i++) {
                if (rows[i][0] && String(rows[i][0]).trim().toUpperCase() === 'SKU') {
                  dataStart = i + 1;
                  break;
                }
              }

              rows.slice(dataStart).forEach(function(row) {
                if (!row[0]) return;
                var sku = String(row[0]).trim().toUpperCase();
                if (!sku) return;

                var temQtd = row[1] !== null && row[1] !== undefined && row[1] !== '';
                var temCusto = row[2] !== null && row[2] !== undefined && row[2] !== '';

                skusDaPlanilha.push({
                  marca: marca, sku: sku,
                  unidades: temQtd ? (parseInt(row[1]) || 0) : null,
                  custo: temCusto ? (parseFloat(String(row[2]).replace(',', '.')) || 0) : null,
                  temQtd: temQtd, temCusto: temCusto
                });
              });
            });

            if (skusDaPlanilha.length === 0) {
              alert('Nenhum SKU encontrado no arquivo.');
              setImporting(false);
              return;
            }

            // Remove duplicatas
            var deduped = {};
            skusDaPlanilha.forEach(function(item) { deduped[item.marca + '|' + item.sku] = item; });
            var skusUnicos = Object.keys(deduped).map(function(k) { return deduped[k]; });

            var existentesEstoque = estoque.map(function(x) {
              return { id: x.id, marca: (x.marca||'').toUpperCase(), sku: (x.sku||'').toUpperCase() };
            });

            var opsEstoque = [];
            var paraUpsertPrecos = [];
            var inseridosEstoque = 0, atualizadosEstoque = 0;

            skusUnicos.forEach(function(item) {
              if (item.temQtd) {
                var found = existentesEstoque.find(function(x) { return x.marca === item.marca && x.sku === item.sku; });
                if (found) {
                  opsEstoque.push(supabase.from('estoque').update({ unidades: item.unidades }).eq('id', found.id));
                  atualizadosEstoque++;
                } else {
                  opsEstoque.push(supabase.from('estoque').insert([{ marca: item.marca, sku: item.sku, unidades: item.unidades }]));
                  inseridosEstoque++;
                }
              }
              if (item.temCusto) {
                paraUpsertPrecos.push({ marca: item.marca, sku: item.sku, custo: item.custo });
              }
            });

            // Upsert preços em lotes de 500
            var opsPrecos = [];
            var chunkSize = 500;
            for (var ci = 0; ci < paraUpsertPrecos.length; ci += chunkSize) {
              opsPrecos.push(
                supabase.from('precos').upsert(paraUpsertPrecos.slice(ci, ci + chunkSize), { onConflict: 'marca,sku', ignoreDuplicates: false })
              );
            }

            var todasOps = opsEstoque.concat(opsPrecos);
            if (todasOps.length === 0) {
              alert('Nenhuma alteração para aplicar.');
              setImporting(false);
              return;
            }

            Promise.all(todasOps).then(function(results) {
              var err = results.find(function(r) { return r && r.error; });
              if (err) {
                alert('Erro na importação: ' + err.error.message);
                setImporting(false);
                return;
              }
              var msg = '✓ Importação concluída! ' + skusUnicos.length + ' SKUs processados.\n';
              if (inseridosEstoque > 0 || atualizadosEstoque > 0)
                msg += 'Estoque: ' + inseridosEstoque + ' inseridos, ' + atualizadosEstoque + ' atualizados\n';
              if (paraUpsertPrecos.length > 0)
                msg += 'Preços: ' + paraUpsertPrecos.length + ' custos salvos';
              alert(msg);
              carregarEstoque();
              if (paraUpsertPrecos.length > 0) carregarPrecos();
              setImporting(false);
            });
          } catch (err) {
            alert('Erro ao processar arquivo: ' + err.message);
            setImporting(false);
          }
        };
        reader.readAsArrayBuffer(file);
      }

      function importarVendas(file) {
        var nomeLoja = file.name.replace(/\.[^.]+$/, '').toUpperCase();
        var reader = new FileReader();
        reader.onload = function(e) {
          try {
            var data = new Uint8Array(e.target.result);
            var wb = XLSX.read(data, {type: 'array'});
            var sheetName = wb.SheetNames.find(function(n) { return n.toLowerCase().indexOf('venda') !== -1; }) || wb.SheetNames[0];
            var rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header: 1, defval: ''});

            // Encontra linha de cabeçalho (tem "SKU" em alguma coluna)
            var headerIdx = -1;
            var colSku = -1, colTotal = -1, colUnidades = -1;
            for (var i = 0; i < Math.min(rows.length, 10); i++) {
              var row = rows[i];
              for (var j = 0; j < row.length; j++) {
                var val = String(row[j]).trim().toUpperCase();
                if (val === 'SKU') { colSku = j; headerIdx = i; }
                if (val === 'TOTAL (BRL)') colTotal = j;
                if (val === 'UNIDADES') colUnidades = j;
              }
              if (headerIdx !== -1) break;
            }
            if (colSku === -1) { alert('Coluna SKU não encontrada na planilha ' + nomeLoja); return; }
            if (colTotal === -1) colTotal = 17;
            if (colUnidades === -1) colUnidades = 6;

            // Agrupa por SKU
            var grupos = {};
            rows.slice(headerIdx + 1).forEach(function(row) {
              var skuRaw = String(row[colSku] || '').trim();
              if (!skuRaw) return;
              var total = parseFloat(row[colTotal]) || 0;
              if (total <= 0) return;
              var chave = nomeLoja + '||' + skuRaw;
              if (!grupos[chave]) grupos[chave] = { loja: nomeLoja, skuRaw: skuRaw, count: 0, receitaTotal: 0 };
              grupos[chave].count++;
              grupos[chave].receitaTotal += total;
            });

            var novosCards = Object.keys(grupos).map(function(k) { return grupos[k]; });

            setVendasData(function(prev) {
              // Remove registros anteriores dessa loja e adiciona novos
              var semLoja = prev.filter(function(x) { return x.loja !== nomeLoja; });
              return semLoja.concat(novosCards);
            });
          } catch(err) {
            alert('Erro ao ler planilha de vendas ' + nomeLoja + ': ' + err.message);
          }
        };
        reader.readAsArrayBuffer(file);
      }

      function normStr(s) {
        return String(s).toUpperCase().replace(/\s+/g, '').replace(/[^A-Z0-9]/g, '');
      }

      function parseSKUsML(celula) {
        var result = [];
        if (!celula) return result;
        var texto = String(celula).trim().toUpperCase();
        // Remove leading KIT: prefix
        texto = texto.replace(/^KIT:\s*/i, '');
        // Split by + (multiple items in kit)
        var partes = texto.split('+');
        var ultimaMarca = '';
        partes.forEach(function(parte) {
          parte = parte.trim();
          // Remove quantity suffix like "- 2UN", "- 3UN" etc
          parte = parte.replace(/\s*-\s*\d+\s*UN\s*$/i, '').trim();
          if (!parte) return;
          if (parte.indexOf(':') !== -1) {
            var idx = parte.indexOf(':');
            var marcaRaw = parte.substring(0, idx).trim();
            var skuRaw = parte.substring(idx + 1).trim();
            if (marcaRaw && skuRaw) {
              ultimaMarca = marcaRaw;
              result.push({ marca: normStr(marcaRaw), sku: normStr(skuRaw) });
            }
          } else if (parte && ultimaMarca) {
            // No marca prefix — use last seen marca
            result.push({ marca: normStr(ultimaMarca), sku: normStr(parte) });
          }
        });
        return result;
      }

      function lerSKUsDoArquivoML(file, idx) {
        // Nome da loja = nome do arquivo sem extensão (ex: KMP.xlsx → KMP)
        var nomeLoja = file.name.replace(/\.[^.]+$/, '').toUpperCase();
        var reader = new FileReader();
        reader.onload = function(evt) {
          try {
            var wb = XLSX.read(evt.target.result, { type: 'array' });
            var sheetName = wb.SheetNames.find(function(n) {
              return n.toLowerCase().indexOf('an') !== -1;
            }) || wb.SheetNames[0];
            var ws = wb.Sheets[sheetName];
            var rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
            var headerRow = rows[0] || [];
            var skuColIdx = -1;
            for (var ci = 0; ci < headerRow.length; ci++) {
              if (String(headerRow[ci]).toUpperCase() === 'SKU') { skuColIdx = ci; break; }
            }
            if (skuColIdx === -1) skuColIdx = 4;
            var skuSet = {};
            for (var ri = 4; ri < rows.length; ri++) {
              var skuCell = rows[ri][skuColIdx];
              if (!skuCell) continue;
              var parsed = parseSKUsML(String(skuCell));
              parsed.forEach(function(p) { skuSet[p.marca + '|' + p.sku] = true; });
            }
            // Calcula nova lista fora do setState
            var novaLista = mlLojas.slice();
            var existe = novaLista.findIndex(function(l) { return l.nome === nomeLoja; });
            var actualIdx = existe !== -1 ? existe : Math.min(idx, novaLista.length);
            if (existe !== -1) {
              novaLista[existe] = { nome: nomeLoja, skuSet: skuSet, idx: actualIdx };
            } else {
              novaLista.push({ nome: nomeLoja, skuSet: skuSet, idx: actualIdx });
              novaLista = novaLista.map(function(l, i) { return { nome: l.nome, skuSet: l.skuSet, idx: i }; });
              actualIdx = novaLista.findIndex(function(l) { return l.nome === nomeLoja; });
            }
            // Salva no Supabase ANTES de atualizar estado
            supabase.from('ml_lojas').upsert(
              { nome: nomeLoja, sku_set: skuSet, idx: actualIdx, updated_at: new Date().toISOString() },
              { onConflict: 'nome' }
            ).then(function(res) {
              if (res.error) {
                alert('Erro ao salvar loja ML no Supabase: ' + res.error.message);
              }
            });
            setMlLojas(novaLista);
          } catch(err) {
            alert('Erro ao ler planilha do ML: ' + err.message);
          }
        };
        reader.readAsArrayBuffer(file);
      }

      // ===== Motor de drag estilo Trello =====
      // Segurar e mover (>6px) = arrastar (clone segue o mouse, placeholder mostra onde cai).
      // Soltar sem mover = clique normal (abre/edita).
      function kDragComecar(ev, cfg) {
        if (ev.button !== 0) return;
        if (ev.target.closest && ev.target.closest('input, button, textarea, select, a')) return;
        var alvo = cfg.elemento || ev.currentTarget;
        var startX = ev.clientX, startY = ev.clientY;
        var rect = alvo.getBoundingClientRect();
        var iniciou = false;
        function aoMover(mev) {
          var dx = mev.clientX - startX, dy = mev.clientY - startY;
          if (!iniciou && (dx * dx + dy * dy) > 36) {
            iniciou = true;
            window._kDragAtivo = true;
            var clone = alvo.cloneNode(true);
            clone.style.position = 'fixed';
            clone.style.left = rect.left + 'px';
            clone.style.top = rect.top + 'px';
            clone.style.width = rect.width + 'px';
            clone.style.height = rect.height + 'px';
            clone.style.zIndex = '9999';
            clone.style.pointerEvents = 'none';
            clone.style.transform = 'rotate(3deg)';
            clone.style.boxShadow = '0 16px 32px rgba(0,0,0,0.5)';
            clone.style.opacity = '0.95';
            document.body.appendChild(clone);
            window._kClone = clone;
            window._kCloneBase = {left: rect.left, top: rect.top};
            document.body.style.userSelect = 'none';
            document.body.style.cursor = 'grabbing';
            setKdrag({tipo: cfg.tipo, id: cfg.id, h: rect.height, w: rect.width});
          }
          if (iniciou) {
            window._kClone.style.left = (window._kCloneBase.left + dx) + 'px';
            window._kClone.style.top = (window._kCloneBase.top + dy) + 'px';
            var drop = cfg.calcularDrop(mev.clientX, mev.clientY);
            var prevDrop = window._kDrop;
            if (JSON.stringify(prevDrop) !== JSON.stringify(drop)) {
              window._kDrop = drop;
              setKdrop(drop);
            }
          }
        }
        function aoSoltar() {
          document.removeEventListener('mousemove', aoMover);
          document.removeEventListener('mouseup', aoSoltar);
          if (iniciou) {
            if (window._kClone) { window._kClone.remove(); window._kClone = null; }
            document.body.style.userSelect = '';
            document.body.style.cursor = '';
            var drop = window._kDrop;
            window._kDrop = null;
            window._kDragAtivo = false;
            setKdrag(null);
            setKdrop(null);
            if (drop) cfg.aoSoltar(drop);
          } else if (cfg.aoClicar) {
            cfg.aoClicar();
          }
        }
        document.addEventListener('mousemove', aoMover);
        document.addEventListener('mouseup', aoSoltar);
      }

      function calcularDropCartao(x, y, cartaoId) {
        var colunas = document.querySelectorAll('[data-klista]');
        var melhor = null, melhorDist = Infinity;
        colunas.forEach(function(col) {
          var r = col.getBoundingClientRect();
          var dist = (x >= r.left && x <= r.right) ? 0 : Math.min(Math.abs(x - r.left), Math.abs(x - r.right));
          if (dist < melhorDist) { melhorDist = dist; melhor = col; }
        });
        if (!melhor) return null;
        var listaId = melhor.getAttribute('data-klista');
        var cards = melhor.querySelectorAll('[data-kcartao]');
        var index = 0;
        for (var i = 0; i < cards.length; i++) {
          if (cards[i].getAttribute('data-kcartao') === String(cartaoId)) continue;
          var cr = cards[i].getBoundingClientRect();
          if (y > cr.top + cr.height / 2) index++;
        }
        return {listaId: listaId, index: index};
      }

      function calcularDropLista(x) {
        var colunas = document.querySelectorAll('[data-klista]');
        var index = 0;
        colunas.forEach(function(col) {
          if (col.getAttribute('data-kdragging') === '1') return;
          var r = col.getBoundingClientRect();
          if (x > r.left + r.width / 2) index++;
        });
        return {index: index};
      }

      function calcularDropItem(y) {
        var linhas = document.querySelectorAll('[data-kitem]');
        var antesDeId = null;
        for (var i = 0; i < linhas.length; i++) {
          if (linhas[i].getAttribute('data-kdragging') === '1') continue;
          var r = linhas[i].getBoundingClientRect();
          if (y < r.top + r.height / 2) { antesDeId = linhas[i].getAttribute('data-kitem'); break; }
        }
        return {antesDeId: antesDeId};
      }

      function moverCartaoIdx(cartaoId, destListaId, destIndex) {
        var cartao = kanbanCartoes.find(function(c) { return c.id === cartaoId; });
        if (!cartao) return;
        var srcListaId = cartao.lista_id;
        var dest = kanbanCartoes.filter(function(c) { return c.lista_id === destListaId && c.id !== cartaoId; })
          .sort(function(a, b) { return a.ordem - b.ordem; });
        var idx = Math.max(0, Math.min(destIndex == null ? dest.length : destIndex, dest.length));
        dest.splice(idx, 0, Object.assign({}, cartao, {lista_id: destListaId}));
        var atualizados = dest.map(function(c, i) { return Object.assign({}, c, {ordem: i}); });
        if (srcListaId !== destListaId) {
          var src = kanbanCartoes.filter(function(c) { return c.lista_id === srcListaId && c.id !== cartaoId; })
            .sort(function(a, b) { return a.ordem - b.ordem; });
          atualizados = atualizados.concat(src.map(function(c, i) { return Object.assign({}, c, {ordem: i}); }));
        }
        var mudados = atualizados.filter(function(c) {
          var antigo = kanbanCartoes.find(function(x) { return x.id === c.id; });
          return !antigo || antigo.ordem !== c.ordem || antigo.lista_id !== c.lista_id;
        });
        if (mudados.length === 0) return;
        setKanbanCartoes(function(prev) {
          return prev.map(function(c) {
            var u = mudados.find(function(x) { return x.id === c.id; });
            return u || c;
          }).sort(function(a, b) { return a.ordem - b.ordem; });
        });
        mudados.forEach(function(c) {
          supabase.from('kanban_cartoes').update({lista_id: c.lista_id, ordem: c.ordem}).eq('id', c.id).then(function() {});
        });
      }

      function marcaMatch(marcaPrecos, marcaKit) {

      function parseKitComponentesML(skuString) {
        var result = [];
        var texto = String(skuString).trim().toUpperCase().replace(/^KIT:\s*/i, '');
        var partes = texto.split('+');
        var ultimaMarca = '';
        partes.forEach(function(parte) {
          parte = parte.trim();
          var qtdMatch = parte.match(/\s*-\s*(\d+)\s*UN\s*$/i);
          var quantidade = qtdMatch ? parseInt(qtdMatch[1]) : 1;
          parte = parte.replace(/\s*-\s*\d+\s*UN\s*$/i, '').trim();
          if (!parte) return;
          if (parte.indexOf(':') !== -1) {
            var idx = parte.indexOf(':');
            var marcaRaw = parte.substring(0, idx).trim();
            var skuRaw  = parte.substring(idx + 1).trim();
            var skuN = normStr(skuRaw);
            if (marcaRaw && skuN && skuN.length >= 2 && skuN.length <= 25) {
              ultimaMarca = marcaRaw;
              result.push({ marca: normStr(marcaRaw), sku: skuN, skuOriginal: skuRaw.trim(), quantidade: quantidade });
            }
          } else if (parte && ultimaMarca) {
            var s = normStr(parte);
            if (s && s.length >= 2 && s.length <= 25)
              result.push({ marca: normStr(ultimaMarca), sku: s, skuOriginal: parte.trim(), quantidade: quantidade });
          }
        });
        return result;
      }

      var fazendoBackupState = useState(false);

      function backupCompleto() {
        if (fazendoBackup) return;
        setFazendoBackup(true);
        // Busca TODAS as tabelas frescas do banco (não depende do que está na tela)
        function puxarTudo(tabela) {
          var batch = 1000, acc = [];
          function ler(from) {
            return supabase.from(tabela).select('*').range(from, from + batch - 1).then(function(r) {
              if (r.error) throw new Error(tabela + ': ' + r.error.message);
              acc = acc.concat(r.data || []);
              if ((r.data || []).length === batch) return ler(from + batch);
              return acc;
            });
          }
          return ler(0);
        }
        var tabelas = ['estoque', 'precos', 'markup_marcas', 'ml_lojas', 'kanban_listas', 'kanban_cartoes', 'kanban_itens'];
        Promise.all(tabelas.map(puxarTudo)).then(function(resultados) {
          var wb = XLSX.utils.book_new();
          tabelas.forEach(function(nome, i) {
            var linhas = resultados[i];
            var ws;
            if (linhas.length === 0) {
              ws = XLSX.utils.aoa_to_sheet([['(vazio)']]);
            } else {
              // ml_lojas tem sku_set (objeto gigante) — serializa como texto pra caber na planilha
              var limpas = linhas.map(function(row) {
                var novo = {};
                Object.keys(row).forEach(function(k) {
                  var v = row[k];
                  novo[k] = (v !== null && typeof v === 'object') ? JSON.stringify(v) : v;
                });
                return novo;
              });
              ws = XLSX.utils.json_to_sheet(limpas);
            }
            XLSX.utils.book_append_sheet(wb, ws, nome.slice(0, 31));
          });
          var hoje = new Date();
          var stamp = hoje.getFullYear() + '-' +
            String(hoje.getMonth() + 1).padStart(2, '0') + '-' +
            String(hoje.getDate()).padStart(2, '0') + '_' +
            String(hoje.getHours()).padStart(2, '0') + 'h' +
            String(hoje.getMinutes()).padStart(2, '0');
          XLSX.writeFile(wb, 'backup_sistema_' + stamp + '.xlsx');
          setFazendoBackup(false);
        }).catch(function(err) {
          alert('Erro ao gerar backup: ' + err.message + '\nNada foi alterado. Tente novamente.');
          setFazendoBackup(false);
        });
      }

      function processarEnviosFull(file) {
        setImporting(true);
        setPendingChanges(null);

        var reader = new FileReader();
        reader.onload = function(evt) {
          try {
            var wb = XLSX.read(evt.target.result, { type: 'array' });
            var ws = wb.Sheets[wb.SheetNames[0]];
            var rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

            // Pula cabeçalho (linha 0) e lê as demais
            var entries = [];
            for (var i = 1; i < rows.length; i++) {
              var row = rows[i];
              var marca = normStr(String(row[0] || ''));
              var sku   = normStr(String(row[1] || ''));
              var qty   = parseInt(row[2]) || 0;
              if (marca && sku && qty > 0) {
                entries.push({ marca: marca, sku: sku, qty: qty });
              }
            }

            if (entries.length === 0) {
              alert('Nenhum item encontrado na planilha.');
              setImporting(false);
              return;
            }

            var dbItems = estoque.map(function(x) {
              return { id: x.id, marca: normStr(x.marca), sku: normStr(x.sku), marcaOrig: x.marca, skuOrig: x.sku, unidades: x.unidades };
            });

            var changeMap = {};
            var naoEncontrados = [];

            entries.forEach(function(entry) {
              var dbItem = dbItems.find(function(d) { return d.marca === entry.marca && d.sku === entry.sku; });
              if (!dbItem) dbItem = dbItems.find(function(d) { return d.sku === entry.sku; });

              if (dbItem) {
                if (changeMap[dbItem.id]) {
                  changeMap[dbItem.id].baixa += entry.qty;
                  changeMap[dbItem.id].novoEstoque = Math.max(0, changeMap[dbItem.id].estoqueAtual - changeMap[dbItem.id].baixa);
                } else {
                  changeMap[dbItem.id] = { id: dbItem.id, marca: dbItem.marcaOrig, sku: dbItem.skuOrig, estoqueAtual: dbItem.unidades, baixa: entry.qty, novoEstoque: Math.max(0, dbItem.unidades - entry.qty) };
                }
              } else {
                naoEncontrados.push(entry.marca + ': ' + entry.sku + ' (qty: ' + entry.qty + ')');
              }
            });

            var changes = Object.keys(changeMap).map(function(k) { return changeMap[k]; });
            setPendingChanges({ changes: changes, naoEncontrados: naoEncontrados });
            setImporting(false);
          } catch(err) {
            alert('Erro ao ler planilha: ' + err.message);
            setImporting(false);
          }
        };
        reader.readAsArrayBuffer(file);
      }

                              className: 'text-slate-400 hover:text-white text-xs px-1 flex-shrink-0',
                              title: 'Renomear etiqueta'
                            }, '✏️'),
                            e('button', {
                              onClick: function() { excluirEtiqueta(et.id); },
                              className: 'text-slate-500 hover:text-red-400 text-sm px-1 flex-shrink-0',
                              title: 'Excluir etiqueta'
                            }, '🗑')
                          );
                        })
                      ),
                      e('div', {className: 'border-t border-slate-700 pt-2'},
                        e('div', {className: 'text-xs text-slate-400 font-semibold mb-1.5'}, 'Criar uma nova etiqueta'),
                        e('input', {
                          type: 'text',
                          placeholder: 'Nome (opcional)...',
                          value: novaEtiquetaNome,
                          onChange: function(ev) { setNovaEtiquetaNome(ev.target.value); },
                          onKeyDown: function(ev) { if (ev.key === 'Enter') criarEtiqueta(); },
                          className: 'w-full bg-slate-800 border border-slate-600 text-white text-xs px-2 py-1.5 rounded-lg focus:outline-none focus:border-blue-400 mb-2'
                        }),
                        e('div', {className: 'flex flex-wrap gap-1.5 mb-2'},
                          CORES_ETIQUETA.map(function(cor) {
                            return e('button', {
                              key: cor,
                              onClick: function() { setNovaEtiquetaCor(cor); },
                              className: 'w-9 h-7 rounded transition-transform ' + (novaEtiquetaCor === cor ? 'ring-2 ring-white scale-110' : 'hover:scale-105'),
                              style: {backgroundColor: cor}
                            });
                          })
                        ),
                        e('button', {
                          onClick: criarEtiqueta,
                          className: 'w-full bg-blue-600 hover:bg-blue-500 text-white text-xs py-1.5 rounded-lg font-bold transition-colors'
                        }, 'Criar')
                      )
                    )
                  ),

                  e('div', {className: 'mb-1 text-xs text-slate-400 font-semibold'}, modalPct + '%'),
                  e('div', {className: 'w-full bg-slate-600 rounded-full h-2 mb-4'},
                    e('div', {
                      className: 'h-2 rounded-full transition-all ' + (modalPct === 100 ? 'bg-green-500' : 'bg-blue-500'),
                      style: {width: modalPct + '%'}
                    })
                  ),
                  e('div', {className: 'space-y-1 mb-4 max-h-96 overflow-y-auto'},
                    (function() {
                      var linhas = [];
                      var placeholderItem = kdrag && kdrag.tipo === 'item'
                        ? e('div', {key: 'ph-item', className: 'rounded-lg bg-slate-700 border border-dashed border-slate-500', style: {height: kdrag.h + 'px'}})
                        : null;
                      modalExibidos.forEach(function(item) {
                        var arrastando = kdrag && kdrag.tipo === 'item' && kdrag.id === item.id;
                        if (arrastando) return;
                        if (placeholderItem && kdrop && kdrop.antesDeId === item.id) linhas.push(placeholderItem);
                        linhas.push(e('div', {
                          key: item.id,
                          'data-kitem': item.id,
                          onMouseDown: function(ev) {
                            if (editandoItemId === item.id) return;
                            kDragComecar(ev, {
                              tipo: 'item',
                              id: item.id,
                              calcularDrop: function(x, y) { return calcularDropItem(y); },
                              aoSoltar: function(drop) { reordenarItensIdx(item.id, drop.antesDeId); },
                              aoClicar: function() { setEditandoItemId(item.id); setEditandoItemTexto(item.texto); }
                            });
                          },
                          className: 'flex items-center gap-2 py-1.5 px-2 rounded-lg cursor-grab hover:bg-slate-700 transition-colors'
                        },
                          e('input', {
                            type: 'checkbox',
                            checked: item.feito,
                            onChange: function() { toggleItem(item); },
                            className: 'w-4 h-4 accent-green-500 cursor-pointer flex-shrink-0'
                          }),
                          editandoItemId === item.id
                            ? e('input', {
                                type: 'text',
                                autoFocus: true,
                                value: editandoItemTexto,
                                onChange: function(ev) { setEditandoItemTexto(ev.target.value); },
                                onKeyDown: function(ev) {
                                  if (ev.key === 'Enter') salvarTextoItem(item.id);
                                  if (ev.key === 'Escape') setEditandoItemId(null);
                                },
                                onBlur: function() { salvarTextoItem(item.id); },
                                className: 'flex-1 bg-slate-700 border border-blue-400 text-white text-sm px-2 py-0.5 rounded focus:outline-none'
                              })
                            : e('span', {
                                className: 'text-sm flex-1 ' + (item.feito ? 'line-through text-slate-500' : 'text-slate-200'),
                                title: 'Clique para editar, segure para mover'
                              }, item.texto),
                          item.feito && item.feito_em && e('span', {className: 'text-xs text-slate-500 flex-shrink-0', title: new Date(item.feito_em).toLocaleString('pt-BR')}, '✓ ' + tempoRelativo(item.feito_em)),
                          e('button', {
                            onClick: function(ev) { ev.stopPropagation(); excluirItem(item); },
                            className: 'text-slate-600 hover:text-red-400 text-sm flex-shrink-0 px-1 transition-colors',
                            title: 'Excluir item'
                          }, '✕')
                        ));
                      });
                      if (placeholderItem && kdrop && kdrop.antesDeId === null) linhas.push(placeholderItem);
                      return linhas;
                    })()
                  ),
                  e('div', {className: 'flex gap-2'},
                    e('input', {
                      type: 'text',
                      placeholder: 'Adicionar um item...',
                      value: novoItemTexto,
                      onChange: function(ev) { setNovoItemTexto(ev.target.value); },
                      onKeyDown: function(ev) { if (ev.key === 'Enter') adicionarItem(kanbanModalCartao.id); },
                      className: 'flex-1 bg-slate-700 border border-slate-500 text-white text-sm px-3 py-2 rounded-lg focus:outline-none focus:border-blue-400'
                    }),
                    e('button', {
                      onClick: function() { adicionarItem(kanbanModalCartao.id); },
                      className: 'bg-blue-600 hover:bg-blue-500 text-white text-sm px-4 py-2 rounded-lg font-bold transition-colors'
                    }, '+')
                  )
                )
              ),

              e('div', {className: 'flex gap-4 overflow-x-auto pb-4', style: {alignItems: 'flex-start'}},
                (function() {
                  var colunas = [];
                  var visLista = 0;
                  var placeholderLista = kdrag && kdrag.tipo === 'lista'
                    ? function(k) {
                        return e('div', {
                          key: 'ph-lista-' + k,
                          className: 'flex-shrink-0 w-80 rounded-xl bg-slate-700 bg-opacity-60 border-2 border-dashed border-slate-500',
                          style: {height: kdrag.h + 'px'}
                        });
                      }
                    : null;

                  kanbanListas.forEach(function(lista) {
                    var arrastandoLista = kdrag && kdrag.tipo === 'lista' && kdrag.id === lista.id;
                    if (arrastandoLista) return;
                    if (placeholderLista && kdrop && kdrop.index === visLista) colunas.push(placeholderLista(visLista));
                    visLista++;

                    var cartoesLista = kanbanCartoes.filter(function(c) { return c.lista_id === lista.id; })
                      .sort(function(a, b) { return a.ordem - b.ordem; });
                    var estaEditandoLista = editandoListaId === lista.id;

                    // Cartões (com placeholder de drop no meio, estilo Trello)
                    var cartoesNodes = [];
                    var visCartao = 0;
                    var placeholderCartao = kdrag && kdrag.tipo === 'cartao'
                      ? function(k) {
                          return e('div', {
                            key: 'ph-cartao-' + k,
                            className: 'rounded-lg bg-slate-600 bg-opacity-70 border-2 border-dashed border-slate-500',
                            style: {height: kdrag.h + 'px'}
                          });
                        }
                      : null;
                    var dropAqui = placeholderCartao && kdrop && kdrop.listaId === String(lista.id);

                    cartoesLista.forEach(function(cartao) {
                      var arrastandoCartao = kdrag && kdrag.tipo === 'cartao' && kdrag.id === cartao.id;
                      if (arrastandoCartao) return;
                      if (dropAqui && kdrop.index === visCartao) cartoesNodes.push(placeholderCartao(visCartao));
                      visCartao++;

                      var itensCartao = kanbanItens.filter(function(i) { return i.cartao_id === cartao.id; });
                      var feitosCartao = itensCartao.filter(function(i) { return i.feito; }).length;
                      var totalCartao = itensCartao.length;
                      var pctCartao = totalCartao > 0 ? Math.round(feitosCartao / totalCartao * 100) : 0;
                      var tudo100 = totalCartao > 0 && feitosCartao === totalCartao;

                      var ultimoCheck = null;
                      itensCartao.forEach(function(i) {
                        if (i.feito && i.feito_em && (!ultimoCheck || i.feito_em > ultimoCheck)) ultimoCheck = i.feito_em;
                      });
                      var horasDesdeCheck = ultimoCheck ? (Date.now() - new Date(ultimoCheck).getTime()) / 3600000 : null;
                      var corCheck = horasDesdeCheck === null ? 'text-slate-400'
                        : horasDesdeCheck < 24 ? 'text-green-600'
                        : horasDesdeCheck < 72 ? 'text-yellow-600'
                        : 'text-red-500';

                      var etiquetasDoCartao = cartaoEtiquetas
                        .filter(function(ce) { return ce.cartao_id === cartao.id; })
                        .map(function(ce) { return kanbanEtiquetas.find(function(et) { return et.id === ce.etiqueta_id; }); })
                        .filter(Boolean);

                      cartoesNodes.push(e('div', {
                        key: cartao.id,
                        'data-kcartao': cartao.id,
                        onMouseDown: function(ev) {
                          kDragComecar(ev, {
                            tipo: 'cartao',
                            id: cartao.id,
                            calcularDrop: function(x, y) { return calcularDropCartao(x, y, cartao.id); },
                            aoSoltar: function(drop) { moverCartaoIdx(cartao.id, drop.listaId, drop.index); },
                            aoClicar: function() { setKanbanModalCartao(cartao); setNovoItemTexto(''); setKanbanOcultarMarcados(false); }
                          });
                        },
                        className: 'bg-white rounded-lg p-3 cursor-pointer hover:ring-2 hover:ring-blue-300 transition-shadow shadow'
                      },
                        etiquetasDoCartao.length > 0 && e('div', {className: 'flex flex-wrap gap-1 mb-2'},
                          etiquetasDoCartao.map(function(et) {
                            return e('span', {
                              key: et.id,
                              title: et.nome || '',
                              className: 'h-2 w-10 rounded-full',
                              style: {backgroundColor: et.cor}
                            });
                          })
                        ),
                        e('div', {className: 'flex items-center gap-2 mb-2'},
                          e('div', {className: 'w-4 h-4 rounded-full border-2 flex-shrink-0 ' + (tudo100 ? 'bg-green-500 border-green-500' : 'border-slate-400')}),
                          e('span', {className: 'text-slate-800 text-sm font-semibold'}, cartao.nome)
                        ),
                        totalCartao > 0 && e('div', null,
                          pctCartao === 100 && e('div', {className: 'w-full bg-green-500 rounded-full h-1.5 mb-1'}),
                          pctCartao < 100 && e('div', {className: 'w-full bg-slate-200 rounded-full h-1.5 mb-1'},
                            e('div', {className: 'bg-green-500 h-1.5 rounded-full', style: {width: pctCartao + '%'}})
                          ),
                          e('div', {className: 'flex items-center justify-between gap-1'},
                            e('span', {className: 'text-xs ' + (tudo100 ? 'text-green-600 font-bold' : 'text-slate-500')},
                              (tudo100 ? '✓ ' : '') + feitosCartao + '/' + totalCartao
                            ),
                            ultimoCheck && e('span', {className: 'text-xs font-semibold ' + corCheck},
                              '⏱ ' + tempoRelativo(ultimoCheck)
                            )
                          )
                        )
                      ));
                    });
                    if (dropAqui && kdrop.index >= visCartao) cartoesNodes.push(placeholderCartao('fim'));

                    colunas.push(e('div', {
                      key: lista.id,
                      'data-klista': lista.id,
                      className: 'flex-shrink-0 w-80 bg-slate-800 rounded-xl p-3'
                    },
                      e('div', {
                        className: 'flex items-center justify-between mb-3 ' + (estaEditandoLista ? '' : 'cursor-grab'),
                        onMouseDown: function(ev) {
                          if (estaEditandoLista) return;
                          var colEl = ev.currentTarget.closest('[data-klista]');
                          kDragComecar(ev, {
                            tipo: 'lista',
                            id: lista.id,
                            elemento: colEl,
                            calcularDrop: function(x) { return calcularDropLista(x); },
                            aoSoltar: function(drop) { reordenarListasIdx(lista.id, drop.index); },
                            aoClicar: function() { setEditandoListaId(lista.id); setEditandoListaNome(lista.nome); }
                          });
                        }
                      },
                        estaEditandoLista
                          ? e('div', {className: 'flex items-center gap-2 flex-1 mr-2'},
                              e('input', {
                                type: 'text',
                                autoFocus: true,
                                value: editandoListaNome,
                                onChange: function(ev) { setEditandoListaNome(ev.target.value); },
                                onKeyDown: function(ev) {
                                  if (ev.key === 'Enter') salvarNomeLista(lista.id);
                                  if (ev.key === 'Escape') setEditandoListaId(null);
                                },
                                onBlur: function() { salvarNomeLista(lista.id); },
                                className: 'flex-1 bg-slate-700 border border-blue-400 text-white text-sm font-bold px-2 py-1 rounded-lg focus:outline-none'
                              })
                            )
                          : e('div', {className: 'flex items-center gap-2 group'},
                              e('span', {className: 'font-bold text-white text-sm group-hover:text-blue-300 transition-colors'}, lista.nome),
                              e('span', {className: 'bg-slate-600 text-slate-300 text-xs font-bold px-2 py-0.5 rounded-full'}, cartoesLista.length),
                              e('span', {className: 'opacity-0 group-hover:opacity-100 text-slate-500 text-xs transition-opacity'}, '✏️')
                            ),
                        e('button', {
                          onClick: function() { excluirLista(lista.id); },
                          className: 'text-slate-500 hover:text-red-400 text-sm transition-colors flex-shrink-0',
                          title: 'Excluir lista'
                        }, '✕')
                      ),
                      e('div', {className: 'space-y-2 mb-3'}, cartoesNodes),
                      novoCartaoListaId === lista.id
                        ? e('div', {className: 'space-y-2'},
                            e('input', {
                              type: 'text',
                              placeholder: 'Nome do cartão...',
                              value: novoCartaoNome,
                              autoFocus: true,
                              onChange: function(ev) { setNovoCartaoNome(ev.target.value); },
                              onKeyDown: function(ev) {
                                if (ev.key === 'Enter') adicionarCartao(lista.id);
                                if (ev.key === 'Escape') { setNovoCartaoListaId(null); setNovoCartaoNome(''); }
                              },
                              className: 'w-full bg-slate-700 border border-blue-400 text-white text-sm px-3 py-2 rounded-lg focus:outline-none'
                            }),
                            e('div', {className: 'flex gap-2'},
                              e('button', {
                                onClick: function() { adicionarCartao(lista.id); },
                                className: 'bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-1.5 rounded-lg font-bold transition-colors'
                              }, 'Adicionar'),
                              e('button', {
                                onClick: function() { setNovoCartaoListaId(null); setNovoCartaoNome(''); },
                                className: 'text-slate-400 hover:text-white text-xs px-2 py-1.5 transition-colors'
                              }, '✕')
                            )
                          )
                        : e('button', {
                            onClick: function() { setNovoCartaoListaId(lista.id); setNovoCartaoNome(''); },
                            className: 'w-full text-slate-400 hover:text-white text-sm py-2 flex items-center gap-1 transition-colors'
                          }, e('span', null, '+'), e('span', null, 'Adicionar um cartão'))
                    ));
                  });
                  if (placeholderLista && kdrop && kdrop.index >= visLista) colunas.push(placeholderLista('fim'));
                  return colunas;
                })(),

                e('div', {className: 'flex-shrink-0 w-80'},
                  novaListaNome !== null && e('div', {className: 'bg-slate-800 rounded-xl p-3'},
                    e('input', {
                      type: 'text',
                      placeholder: 'Nome da lista...',
                      value: novaListaNome,
                      onChange: function(ev) { setNovaListaNome(ev.target.value); },
                      onKeyDown: function(ev) { if (ev.key === 'Enter') adicionarLista(); },
                      className: 'w-full bg-slate-700 border border-slate-500 text-white text-sm px-3 py-2 rounded-lg focus:outline-none focus:border-blue-400 mb-2'
                    }),
                    e('button', {
                      onClick: adicionarLista,
                      className: 'w-full bg-blue-600 hover:bg-blue-500 text-white text-sm py-2 rounded-lg font-bold transition-colors'
                    }, '+ Adicionar lista')
                  )
                )
              )
            );
          })()
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(e(App, null));
  </script>
</body>
</html>
