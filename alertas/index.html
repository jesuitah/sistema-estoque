<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alertas</title>
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alertas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" href="icone-192.png">
<!--
  APP DE ALERTAS DO SISTEMA DE ESTOQUE — pro iPhone, instalado pelo Safari.

  Não é o sistema no celular. Pedido do Matheus em 14/09/2026: "só quero no app o que
  for pra dar ok no sistema pra ele seguir rodando". Então esta tela mostra UMA coisa:
  o que precisa de alguém agora. Se nada precisa, ela diz isso e só.

  Nasceu do fim de semana de 12-14/09: a sessão da KMP caiu no sábado às 12:45 e só se
  soube na segunda, porque o aviso estava numa página que ninguém abre no fim de semana.
-->
<style>
  :root {
    --fundo: #0f172a; --cartao: #1e293b; --borda: #334155;
    --texto: #e2e8f0; --fraco: #94a3b8; --apagado: #64748b;
    --verde: #10b981; --vermelho: #ef4444; --ambar: #f59e0b; --azul: #3b82f6;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--fundo); color: var(--texto); }
  body {
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px);
    max-width: 560px; margin: 0 auto; min-height: 100vh;
  }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  .atualizado { color: var(--apagado); font-size: 12px; }

  .resumo {
    border-radius: 18px; padding: 22px 18px; margin-bottom: 16px; text-align: center;
    border: 1px solid var(--borda); background: var(--cartao);
  }
  .resumo .icone { font-size: 44px; line-height: 1; margin-bottom: 8px; }
  .resumo .titulo { font-size: 20px; font-weight: 700; }
  .resumo .sub { color: var(--fraco); font-size: 14px; margin-top: 4px; }
  .resumo.ok { border-color: rgba(16,185,129,.4); background: rgba(16,185,129,.08); }
  .resumo.ok .titulo { color: var(--verde); }
  .resumo.ruim { border-color: rgba(239,68,68,.45); background: rgba(239,68,68,.08); }
  .resumo.ruim .titulo { color: #fca5a5; }

  .pendencia {
    background: var(--cartao); border: 1px solid var(--borda); border-left-width: 4px;
    border-radius: 14px; padding: 14px; margin-bottom: 12px;
  }
  .pendencia.grave { border-left-color: var(--vermelho); }
  .pendencia.atencao { border-left-color: var(--ambar); }
  .pendencia .o-que { font-weight: 700; font-size: 16px; }
  .pendencia .detalhe { color: var(--fraco); font-size: 14px; margin-top: 4px; overflow-wrap: anywhere; }
  .pendencia .instrucao {
    font-size: 13px; color: #fcd34d; background: rgba(245,158,11,.1);
    border-radius: 8px; padding: 8px 10px; margin-top: 10px;
  }
  .grupo-titulo { color: var(--apagado); font-size: 12px; text-transform: uppercase;
    letter-spacing: .06em; margin: 20px 4px 8px; }

  button {
    font: inherit; font-weight: 700; border: 0; border-radius: 12px; cursor: pointer;
    padding: 13px 16px; width: 100%; margin-top: 12px; color: #fff; background: var(--azul);
    min-height: 48px;
  }
  button.verde { background: var(--verde); }
  button.neutro { background: #334155; color: var(--texto); }
  button:disabled { opacity: .55; }
  button.pequeno { width: auto; padding: 9px 14px; min-height: 40px; margin-top: 8px; font-size: 14px; }

  .avisos { margin-top: 24px; background: var(--cartao); border: 1px solid var(--borda);
    border-radius: 14px; padding: 14px; }
  .avisos h2 { font-size: 15px; margin: 0 0 4px; }
  .avisos p { color: var(--fraco); font-size: 14px; margin: 4px 0 0; }
  .passos { margin: 10px 0 0; padding-left: 20px; color: var(--texto); font-size: 14px; }
  .passos li { margin: 6px 0; }
  .ok-texto { color: var(--verde); font-weight: 700; }
  .erro { color: #fca5a5; font-size: 13px; margin-top: 8px; }
  .carregando { text-align: center; color: var(--fraco); padding: 40px 0; }
</style>
</head>
<body>
  <header>
    <h1>Alertas</h1>
    <span class="atualizado" id="atualizado"></span>
  </header>

  <div id="painel"><div class="carregando">Conferindo o sistema…</div></div>

  <div class="avisos" id="avisos"></div>

<script>
// ── Configuração ─────────────────────────────────────────────────────────────
// A chave pública do Supabase é a mesma que o site já usa (ela é pública por natureza).
// A chave VAPID pública também: é o par da privada, que fica trancada no servidor.
var SUPA = 'https://pylkufhziohxvwbbaued.supabase.co';
var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5bGt1Zmh6aW9oeHZ3YmJhdWVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1OTIyNzMsImV4cCI6MjA5MTE2ODI3M30.S61OxgJa03KmfJZ_MdFL0ZKAzWdsrrYwnmzuqN6L0vQ';
var VAPID_PUBLICA = 'BE3-wwv4XF9na0z9fuE2fyKXPMPn5JesmC7JKI95p5tQDsiugk2E2FjX0vf2EtHTeaXpfMMBKdmCXjJxAZ8Y9Dw';
var FUNCAO = SUPA + '/functions/v1/push-alerta';
var ROBO_OFFLINE_MIN = 15;   // o mesmo limite do vigia no servidor

// ── Utilidades ───────────────────────────────────────────────────────────────
function el(tag, attrs, filhos) {
  var n = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function (k) {
    if (k === 'class') n.className = attrs[k];
    else if (k === 'onclick') n.addEventListener('click', attrs[k]);
    else n.setAttribute(k, attrs[k]);
  });
  (filhos || []).forEach(function (f) {
    if (f == null || f === false) return;
    n.appendChild(typeof f === 'string' ? document.createTextNode(f) : f);
  });
  return n;
}

function ler(tabela, consulta) {
  return fetch(SUPA + '/rest/v1/' + tabela + '?' + consulta, {
    headers: { apikey: ANON, Authorization: 'Bearer ' + ANON },
  }).then(function (r) {
    if (!r.ok) throw new Error(tabela + ' respondeu ' + r.status);
    return r.json();
  });
}

function acao(corpo) {
  return fetch(FUNCAO, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(corpo),
  }).then(function (r) {
    return r.json().then(function (d) {
      if (!r.ok || d.erro) throw new Error(d.erro || ('erro ' + r.status));
      return d;
    });
  });
}

function quando(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('pt-BR', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
}
function haQuanto(iso) {
  var min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (min < 1) return 'agora';
  if (min < 60) return 'há ' + min + ' min';
  var h = Math.round(min / 60);
  if (h < 48) return 'há ' + h + ' h';
  return 'há ' + Math.round(h / 24) + ' dias';
}

// Um botão de "ok": trava enquanto trabalha, e relê o painel quando termina.
function botaoOk(texto, classe, corpo) {
  var b = el('button', { class: classe || '' }, [texto]);
  var msg = el('div', { class: 'erro' });
  b.addEventListener('click', function () {
    b.disabled = true; b.textContent = 'Enviando…'; msg.textContent = '';
    acao(corpo).then(function () {
      b.textContent = '✓ Feito';
      setTimeout(atualizar, 800);
    }).catch(function (e) {
      b.disabled = false; b.textContent = texto;
      msg.textContent = 'Não deu: ' + e.message;
    });
  });
  var caixa = el('div', {}, [b, msg]);
  return caixa;
}

// ── O painel ─────────────────────────────────────────────────────────────────
function atualizar() {
  var desde = new Date(Date.now() - 24 * 3600 * 1000).toISOString();
  Promise.all([
    ler('robo_status', 'select=ultima_batida,parar&id=eq.1'),
    ler('robo_sessoes', 'select=conta,caida_desde,proxima_tentativa&caida_desde=not.is.null'),
    ler('robo_alertas', 'select=id,chave,mensagem,criado_em&resolvido_em=is.null&dispensado_em=is.null&gravidade=eq.grave&order=criado_em.desc'),
    ler('ml_tarefas_robo', 'select=id,conta,tipo,params,erro,concluido_em&status=eq.falhou&concluido_em=gte.' + encodeURIComponent(desde) + '&order=concluido_em.desc&limit=100'),
    ler('ml_tarefas_robo', 'select=conta,tipo,params,concluido_em&status=eq.feito&concluido_em=gte.' + encodeURIComponent(desde) + '&limit=1000'),
  ]).then(function (r) {
    desenhar(r[0][0] || {}, r[1], r[2], falhasQueContam(r[3], r[4]));
    document.getElementById('atualizado').textContent = 'atualizado ' +
      new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }).catch(function (e) {
    var p = document.getElementById('painel');
    p.innerHTML = '';
    p.appendChild(el('div', { class: 'resumo ruim' }, [
      el('div', { class: 'icone' }, ['📡']),
      el('div', { class: 'titulo' }, ['Não consegui conferir']),
      el('div', { class: 'sub' }, ['Sem internet, ou o servidor não respondeu. (' + e.message + ')']),
    ]));
  });
}

// DAS TAREFAS QUE FALHARAM, SÓ O QUE AINDA ESTÁ DE PÉ.
//
// A primeira versão listou "8 coisas precisam de você" e nenhuma precisava: duas já
// tinham dado certo numa tentativa seguinte, e as outras seis eram o MESMO par de
// anúncios repetido. Painel que grita por nada vira painel que ninguém abre — e aí o
// aviso de verdade passa batido junto. Aqui fica uma linha por anúncio, e só se ele não
// deu certo depois.
function falhasQueContam(falhas, feitas) {
  function chave(t) { return t.conta + '|' + t.tipo + '|' + ((t.params && t.params.item_id) || t.id); }
  var ultimoSucesso = {};
  feitas.forEach(function (t) {
    var k = chave(t);
    if (!ultimoSucesso[k] || t.concluido_em > ultimoSucesso[k]) ultimoSucesso[k] = t.concluido_em;
  });
  var vistas = {};
  return falhas.filter(function (t) {
    var k = chave(t);
    if (vistas[k]) return false;                                            // repetida
    vistas[k] = true;
    return !(ultimoSucesso[k] && ultimoSucesso[k] > t.concluido_em);        // já resolvida
  });
}

var NOME_TAREFA = {
  tirar_do_full: 'Tirar do Full', ligar_flex: 'Ligar o Flex', desligar_flex: 'Desligar o Flex',
  varrer_promocoes: 'Ler promoções',
};

function desenhar(status, sessoes, alertas, falhas) {
  var painel = document.getElementById('painel');
  painel.innerHTML = '';
  var pendencias = [];

  // 1) Robô desligado — não tem botão: pelo celular não dá pra ligar um PC.
  var minSemSinal = status.ultima_batida
    ? (Date.now() - new Date(status.ultima_batida).getTime()) / 60000 : 99999;
  if (minSemSinal > ROBO_OFFLINE_MIN) {
    pendencias.push(el('div', { class: 'pendencia grave' }, [
      el('div', { class: 'o-que' }, ['🔴 Robô desligado']),
      el('div', { class: 'detalhe' }, ['Último sinal ' + (status.ultima_batida ? haQuanto(status.ultima_batida) : '—') + '.']),
      el('div', { class: 'instrucao' }, ['Precisa de alguém no PC: veja se ele está ligado. O robô volta sozinho em até 5 minutos depois que o PC liga. As tarefas esperam na fila, nada se perde.']),
    ]));
  }

  // 2) Robô parado de propósito (botão "Parar robô").
  if (status.parar) {
    pendencias.push(el('div', { class: 'pendencia atencao' }, [
      el('div', { class: 'o-que' }, ['⏸ Robô pausado']),
      el('div', { class: 'detalhe' }, ['Alguém apertou "Parar robô". Ele está ligado, mas não pega tarefa.']),
      botaoOk('Retomar robô', 'verde', { acao: 'retomar_robo' }),
    ]));
  }

  // 3) Sessão caída — o caso que MAIS parou o sistema. O login em si só dá pra fazer
  // no PC; o botão daqui serve pra depois disso, pra não esperar 30 min à toa.
  sessoes.forEach(function (s) {
    pendencias.push(el('div', { class: 'pendencia grave' }, [
      el('div', { class: 'o-que' }, ['🔌 Sessão da ' + s.conta + ' caiu']),
      el('div', { class: 'detalhe' }, ['Desde ' + quando(s.caida_desde) + '. As tarefas da ' + s.conta + ' estão esperando; as outras lojas seguem normais.']),
      el('div', { class: 'instrucao' }, ['Precisa de alguém no PC: entrar de novo na conta ' + s.conta + ' pelo Chrome do robô. Depois disso, toque abaixo.']),
      botaoOk('Já reconectei — pode seguir', 'verde', { acao: 'liberar_sessao', conta: s.conta }),
    ]));
  });

  // 4) Alertas graves. Os de sessão caída e de tarefa falhada já aparecem acima e
  // abaixo, com o botão certo — repeti-los aqui só daria duas coisas pra tocar.
  alertas.filter(function (a) {
    return a.chave.indexOf('sessao_caida:') !== 0 && a.chave.indexOf('tarefa_falhou:') !== 0;
  }).forEach(function (a) {
    pendencias.push(el('div', { class: 'pendencia grave' }, [
      el('div', { class: 'o-que' }, ['⚠️ Atenção']),
      el('div', { class: 'detalhe' }, [a.mensagem]),
      botaoOk('Ok, já vi', 'neutro', { acao: 'dispensar', id: a.id }),
    ]));
  });

  // O que PRECISA DE ALGUÉM é só o que está acima. Tarefa que falhou não entra nessa
  // conta: quase sempre o robô resolve na próxima, ou é coisa pra investigar, não pra
  // alguém fazer. Ela aparece embaixo, em cinza, sem acender o vermelho do topo.
  var precisa = pendencias.length;

  var extras = [];
  if (falhas.length) {
    extras.push(el('div', { class: 'grupo-titulo' }, ['O robô ainda não conseguiu (' + falhas.length + ')']));
    falhas.forEach(function (t) {
      var titulo = (t.params && t.params.title) || (t.params && t.params.item_id) || '';
      extras.push(el('div', { class: 'pendencia' }, [
        el('div', { class: 'o-que' }, [(NOME_TAREFA[t.tipo] || t.tipo) + ' · ' + t.conta]),
        titulo ? el('div', { class: 'detalhe' }, [titulo]) : null,
        el('div', { class: 'detalhe' }, [explicarErro(t.erro)]),
        botaoOk('Tentar de novo', 'pequeno neutro', { acao: 'tentar_de_novo', id: t.id }),
      ]));
    });
  }

  // O resumo no topo: a resposta pra "preciso fazer alguma coisa?" antes de ler qualquer detalhe.
  painel.appendChild(precisa
    ? el('div', { class: 'resumo ruim' }, [
        el('div', { class: 'icone' }, ['✋']),
        el('div', { class: 'titulo' }, [precisa === 1 ? '1 coisa precisa de você' : precisa + ' coisas precisam de você']),
      ])
    : el('div', { class: 'resumo ok' }, [
        el('div', { class: 'icone' }, ['✅']),
        el('div', { class: 'titulo' }, ['Tudo rodando']),
        el('div', { class: 'sub' }, ['Robô trabalhando · último sinal ' + haQuanto(status.ultima_batida)]),
      ]));
  pendencias.forEach(function (p) { painel.appendChild(p); });
  extras.forEach(function (p) { painel.appendChild(p); });
}

// Erro técnico cru não serve no celular — o primeiro print tinha um endereço de página
// estourando a tela. Uma frase curta diz o suficiente pra saber se é grave.
function explicarErro(erro) {
  var t = String(erro || '');
  if (/sessão da .* caiu|tela de login/i.test(t)) return 'A sessão da loja estava caída.';
  if (/caixinha do Envios Flex/i.test(t)) return 'Não achou a opção de Flex na página do anúncio.';
  if (/Navigation|navigat|Execution context|Target page|browser has been closed/i.test(t))
    return 'A página do Mercado Livre não carregou direito.';
  if (/HTTP 5\d\d|internal|Something went wrong/i.test(t)) return 'O Mercado Livre deu erro interno.';
  if (/HTTP 4\d\d|recusad/i.test(t)) return 'O Mercado Livre recusou a ação.';
  return t.length > 90 ? t.slice(0, 90) + '…' : t;
}

// ── Notificações ─────────────────────────────────────────────────────────────
function chaveParaBytes(base64) {
  var pad = '='.repeat((4 - base64.length % 4) % 4);
  var b = atob((base64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  var saida = new Uint8Array(b.length);
  for (var i = 0; i < b.length; i++) saida[i] = b.charCodeAt(i);
  return saida;
}

function instalado() {
  return window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
}
function ehIphone() { return /iphone|ipad|ipod/i.test(navigator.userAgent); }

function desenharAvisos() {
  var caixa = document.getElementById('avisos');
  caixa.innerHTML = '';
  var suportaPush = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

  // No iPhone, notificação só existe com o app INSTALADO na tela de início. Aberto no
  // Safari, a Apple nem oferece a opção — então o que dá pra mostrar é o passo a passo.
  if (ehIphone() && !instalado()) {
    caixa.appendChild(el('h2', {}, ['📲 Instale pra receber os avisos']));
    caixa.appendChild(el('p', {}, ['No iPhone, os avisos só chegam com o app na tela de início:']));
    caixa.appendChild(el('ol', { class: 'passos' }, [
      el('li', {}, ['Toque no botão Compartilhar (o quadrado com a seta pra cima), embaixo no Safari']),
      el('li', {}, ['Role e toque em "Adicionar à Tela de Início"']),
      el('li', {}, ['Toque em "Adicionar"']),
      el('li', {}, ['Abra o app "Alertas" pela tela de início e ative os avisos']),
    ]));
    return;
  }

  if (!suportaPush) {
    caixa.appendChild(el('h2', {}, ['Avisos indisponíveis aqui']));
    caixa.appendChild(el('p', {}, ['Este navegador não aceita notificações. No iPhone, precisa do iOS 16.4 ou mais novo.']));
    return;
  }

  navigator.serviceWorker.register('sw.js').then(function (reg) {
    return navigator.serviceWorker.ready.then(function () { return reg.pushManager.getSubscription(); })
      .then(function (inscricao) {
        if (inscricao && Notification.permission === 'granted') {
          caixa.appendChild(el('h2', {}, [el('span', { class: 'ok-texto' }, ['🔔 Avisos ativados'])]));
          caixa.appendChild(el('p', {}, ['Quando o sistema precisar de você, chega notificação neste celular.']));
          caixa.appendChild(botaoOk('Mandar um aviso de teste', 'neutro', { acao: 'teste' }));
          return;
        }
        if (Notification.permission === 'denied') {
          caixa.appendChild(el('h2', {}, ['🔕 Avisos bloqueados']));
          caixa.appendChild(el('p', {}, ['Os avisos foram recusados. Pra liberar: Ajustes → Notificações → Alertas → Permitir.']));
          return;
        }
        caixa.appendChild(el('h2', {}, ['🔔 Receber avisos neste celular']));
        caixa.appendChild(el('p', {}, ['Robô desligado, sessão caída, tarefa que falhou: chega na hora, mesmo com o app fechado.']));
        var b = el('button', { class: 'verde' }, ['Ativar avisos']);
        var msg = el('div', { class: 'erro' });
        // O pedido de permissão TEM que sair de um toque: o iPhone ignora se vier sozinho.
        b.addEventListener('click', function () {
          b.disabled = true; b.textContent = 'Ativando…'; msg.textContent = '';
          Notification.requestPermission().then(function (perm) {
            if (perm !== 'granted') throw new Error('permissão não concedida');
            return reg.pushManager.subscribe({
              userVisibleOnly: true, applicationServerKey: chaveParaBytes(VAPID_PUBLICA),
            });
          }).then(function (inscricao) {
            return acao({ acao: 'inscrever', inscricao: inscricao.toJSON(), aparelho: navigator.userAgent });
          }).then(function () {
            desenharAvisos();
          }).catch(function (e) {
            b.disabled = false; b.textContent = 'Ativar avisos';
            msg.textContent = 'Não deu: ' + e.message;
          });
        });
        caixa.appendChild(b);
        caixa.appendChild(msg);
      });
  }).catch(function (e) {
    caixa.appendChild(el('p', { class: 'erro' }, ['Não consegui preparar os avisos: ' + e.message]));
  });
}

// ── Início ───────────────────────────────────────────────────────────────────
atualizar();
desenharAvisos();
setInterval(atualizar, 30000);
// Voltou pro app (ou tocou numa notificação): relê na hora, sem esperar os 30s.
document.addEventListener('visibilitychange', function () { if (!document.hidden) atualizar(); });
</script>
</body>
</html>
