<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alertas</title>
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alertas">

<!--
  APP DE ALERTAS DO SISTEMA DE ESTOQUE — pro iPhone, instalado pelo Safari.

  O que o Matheus pediu em 14/09/2026, com as palavras dele:
    - entrar e verificar de maneira visual se está tudo funcionando
    - ter botões pra ajustar o sistema se precisar de alguma ação
    - saber por notificação se tem algo errado, e ao abrir, o botão pra agir
    - NÃO: notificações bestas, ruído
    - usa mais à noite e no fim de semana

  Então a tela tem três andares, nesta ordem:
    1. A resposta: "Tudo rodando" ou "N coisas precisam de você"
    2. O que precisa de você, cada um com o botão pra resolver (só aparece se houver)
    3. Como está cada parte — pra conferir com os próprios olhos, sem confiar na palavra

  Nasceu do fim de semana de 12-14/09: a sessão da KMP caiu no sábado às 12:45 e só se
  soube na segunda, porque o aviso estava numa página que ninguém abre no fim de semana.
-->
<style>
  :root {
    --fundo: #0b1120; --cartao: #151e32; --borda: #243049;
    --texto: #e5e9f0; --fraco: #97a3b6; --apagado: #5f6b80;
    --verde: #22c55e; --vermelho: #f05252; --ambar: #f5a524; --azul: #3b82f6;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--fundo); color: var(--texto); }
  body {
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 28px);
    max-width: 560px; margin: 0 auto; min-height: 100vh;
  }

  header { display: flex; align-items: center; justify-content: space-between; margin: 4px 2px 16px; }
  h1 { font-size: 28px; margin: 0; letter-spacing: -.02em; }
  .rodar-tudo { font: inherit; font-weight: 700; font-size: 15px; color: #fff; background: var(--azul);
    border: 0; border-radius: 999px; padding: 10px 16px; cursor: pointer; min-height: 42px; }
  .rodar-tudo:disabled { opacity: .55; }

  /* O andamento do "Rodar tudo": cada parte vira ✓ quando roda de verdade */
  .rodada { background: var(--cartao); border: 1px solid rgba(59,130,246,.45); border-radius: 16px;
    padding: 14px 16px; margin-bottom: 16px; }
  .rodada.fim { border-color: rgba(34,197,94,.45); }
  .rodada .topo { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .rodada .titulo { font-weight: 700; }
  .rodada .fechar { background: none; border: 0; color: var(--apagado); font: inherit; font-size: 13px; cursor: pointer; padding: 4px 0 4px 10px; }
  .passo { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; font-size: 15px; }
  .passo .marca { width: 20px; text-align: center; flex-shrink: 0; }
  .passo .texto { flex: 1; }
  .passo .quando { color: var(--fraco); font-size: 13px; }
  .passo.esperando .texto { color: var(--fraco); }
  .passo.nao .texto { color: #fca5a5; }
  .girando { display: inline-block; animation: girar 1s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }

  /* 1) A resposta */
  .resposta { border-radius: 20px; padding: 26px 18px 22px; text-align: center; margin-bottom: 18px;
    border: 1px solid var(--borda); background: var(--cartao); }
  .resposta .sinal { width: 58px; height: 58px; border-radius: 50%; margin: 0 auto 12px;
    display: grid; place-items: center; font-size: 30px; }
  .resposta .titulo { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .resposta .sub { color: var(--fraco); font-size: 14px; margin-top: 4px; }
  .resposta.ok { border-color: rgba(34,197,94,.35); background: linear-gradient(180deg, rgba(34,197,94,.10), rgba(34,197,94,.03)); }
  .resposta.ok .sinal { background: rgba(34,197,94,.18); color: var(--verde); }
  .resposta.ok .titulo { color: #86efac; }
  .resposta.ruim { border-color: rgba(240,82,82,.45); background: linear-gradient(180deg, rgba(240,82,82,.12), rgba(240,82,82,.03)); }
  .resposta.ruim .sinal { background: rgba(240,82,82,.2); }
  .resposta.ruim .titulo { color: #fca5a5; }

  /* 2) O que precisa de você */
  .pendencia { background: var(--cartao); border: 1px solid var(--borda); border-radius: 16px;
    padding: 16px; margin-bottom: 12px; position: relative; overflow: hidden; }
  .pendencia::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
  .pendencia.grave::before { background: var(--vermelho); }
  .pendencia.atencao::before { background: var(--ambar); }
  .pendencia .o-que { font-weight: 700; font-size: 17px; }
  .pendencia .detalhe { color: var(--fraco); font-size: 14px; margin-top: 4px; overflow-wrap: anywhere; }
  .pendencia .como { font-size: 14px; color: var(--texto); background: rgba(255,255,255,.04);
    border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
  .pendencia .como b { color: #fcd34d; }

  button.acao { font: inherit; font-weight: 700; font-size: 16px; border: 0; border-radius: 13px;
    cursor: pointer; padding: 14px 16px; width: 100%; margin-top: 12px; color: #fff;
    background: var(--verde); min-height: 50px; }
  button.acao.neutro { background: #2a3752; }
  button.acao:disabled { opacity: .6; }
  .erro { color: #fca5a5; font-size: 13px; margin-top: 8px; }

  /* 3) Como está cada parte */
  .secao { color: var(--apagado); font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .07em; margin: 24px 4px 8px; }
  .partes { background: var(--cartao); border: 1px solid var(--borda); border-radius: 16px; overflow: hidden; }
  .parte { display: flex; align-items: center; gap: 12px; padding: 13px 16px; }
  .parte + .parte { border-top: 1px solid var(--borda); }
  .bolinha { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .bolinha.ok { background: var(--verde); box-shadow: 0 0 0 4px rgba(34,197,94,.15); }
  .bolinha.atencao { background: var(--ambar); box-shadow: 0 0 0 4px rgba(245,165,36,.15); }
  .bolinha.ruim { background: var(--vermelho); box-shadow: 0 0 0 4px rgba(240,82,82,.15); }
  .parte .nome { font-weight: 600; flex: 1; }
  .parte .estado { color: var(--fraco); font-size: 14px; text-align: right; }

  /* Tarefas que não deram certo: recolhido, porque quase nunca é assunto seu */
  details.falhas { margin-top: 12px; background: var(--cartao); border: 1px solid var(--borda); border-radius: 16px; }
  details.falhas summary { list-style: none; cursor: pointer; padding: 13px 16px; color: var(--fraco);
    font-size: 14px; display: flex; justify-content: space-between; }
  details.falhas summary::-webkit-details-marker { display: none; }
  details.falhas summary::after { content: "›"; transition: transform .15s; }
  details.falhas[open] summary::after { transform: rotate(90deg); }
  .falha { padding: 12px 16px; border-top: 1px solid var(--borda); }
  .falha .o-que { font-weight: 600; font-size: 15px; }
  .falha .detalhe { color: var(--fraco); font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
  .falha button.acao { width: auto; min-height: 40px; padding: 9px 16px; font-size: 14px; margin-top: 10px; }

  /* Avisos no rodapé: grande só enquanto não estão ativos */
  .rodape { margin-top: 22px; text-align: center; color: var(--apagado); font-size: 13px; }
  .rodape button { background: none; border: 0; color: var(--azul); font: inherit; font-size: 13px;
    cursor: pointer; padding: 4px; }
  .ativar { background: var(--cartao); border: 1px solid var(--borda); border-radius: 16px; padding: 16px;
    margin-top: 22px; text-align: left; }
  .ativar h2 { font-size: 16px; margin: 0 0 4px; }
  .ativar p { color: var(--fraco); font-size: 14px; margin: 0; }
  .ativar ol { margin: 10px 0 0; padding-left: 20px; font-size: 14px; }
  .ativar li { margin: 6px 0; }

  .carregando { text-align: center; color: var(--fraco); padding: 60px 0; }
</style>
</head>
<body>
  <header>
    <h1>Alertas</h1>
    <button class="rodar-tudo" id="rodarTudo">↻ Rodar tudo</button>
  </header>

  <div id="rodada"></div>
  <main id="painel"><div class="carregando">Conferindo o sistema…</div></main>
  <div id="avisos"></div>
  <div class="rodape" id="atualizado"></div>

<script>
// ── Configuração ─────────────────────────────────────────────────────────────
// Chave pública do Supabase (a mesma do site, pública por natureza) e a chave VAPID
// pública (o par da privada, que fica trancada no servidor).
var SUPA = 'https://pylkufhziohxvwbbaued.supabase.co';
var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5bGt1Zmh6aW9oeHZ3YmJhdWVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1OTIyNzMsImV4cCI6MjA5MTE2ODI3M30.S61OxgJa03KmfJZ_MdFL0ZKAzWdsrrYwnmzuqN6L0vQ';
var VAPID_PUBLICA = 'BE3-wwv4XF9na0z9fuE2fyKXPMPn5JesmC7JKI95p5tQDsiugk2E2FjX0vf2EtHTeaXpfMMBKdmCXjJxAZ8Y9Dw';
var FUNCAO = SUPA + '/functions/v1/push-alerta';

// OS LIMITES DE "ATRASADO" — cada um com folga sobre o ritmo real da rotina.
//
// Bolinha amarela à toa ensina a ignorar a bolinha amarela. Por isso nenhum limite é
// o intervalo exato: a patrulha é de hora em hora mas pode esperar a fila esvaziar, o
// catálogo é de 3 em 3 horas, as promoções uma vez por dia.
var LIMITE = {
  roboMin: 15,           // mesmo número do vigia que manda a notificação
  patrulhaMin: 150,      // de hora em hora, com folga pra fila cheia
  catalogoMin: 240,      // de 3 em 3 horas
  promocoesMin: 26 * 60, // uma vez por dia
};

// ── Utilidades ───────────────────────────────────────────────────────────────
function el(tag, attrs, filhos) {
  var n = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function (k) {
    if (k === 'class') n.className = attrs[k]; else n.setAttribute(k, attrs[k]);
  });
  (filhos || []).forEach(function (f) {
    if (f == null || f === false) return;
    n.appendChild(typeof f === 'string' ? document.createTextNode(f) : f);
  });
  return n;
}

function ler(tabela, consulta) {
  return fetch(SUPA + '/rest/v1/' + tabela + '?' + consulta, {
    headers: { apikey: ANON, Authorization: 'Bearer ' + ANON },
  }).then(function (r) {
    if (!r.ok) throw new Error(tabela + ' respondeu ' + r.status);
    return r.json();
  });
}

function acao(corpo) {
  return fetch(FUNCAO, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo),
  }).then(function (r) {
    return r.json().then(function (d) {
      if (!r.ok || d.erro) throw new Error(d.erro || ('erro ' + r.status));
      return d;
    });
  });
}

function minutosDesde(iso) { return iso ? (Date.now() - new Date(iso).getTime()) / 60000 : Infinity; }

function haQuanto(iso) {
  if (!iso) return 'nunca';
  var min = Math.round(minutosDesde(iso));
  if (min < 1) return 'agora';
  if (min < 60) return 'há ' + min + ' min';
  var h = Math.round(min / 60);
  if (h < 24) return 'há ' + h + ' h';
  var d = Math.round(h / 24);
  return d === 1 ? 'ontem' : 'há ' + d + ' dias';
}

function quando(iso) {
  return new Date(iso).toLocaleString('pt-BR', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
}

// Um botão que resolve algo: trava enquanto trabalha e relê o painel quando termina.
function botao(texto, classe, corpo) {
  var b = el('button', { class: 'acao ' + (classe || '') }, [texto]);
  var msg = el('div', { class: 'erro' });
  b.addEventListener('click', function () {
    b.disabled = true; b.textContent = 'Enviando…'; msg.textContent = '';
    acao(corpo).then(function () {
      b.textContent = '✓ Feito';
      setTimeout(atualizar, 900);
    }).catch(function (e) {
      b.disabled = false; b.textContent = texto;
      msg.textContent = 'Não deu: ' + e.message;
    });
  });
  return el('div', {}, [b, msg]);
}

// ── Leitura ──────────────────────────────────────────────────────────────────
var atualizando = false;
function atualizar() {
  if (atualizando) return;
  atualizando = true;

  var ontem = encodeURIComponent(new Date(Date.now() - 24 * 3600 * 1000).toISOString());
  var ultimaDe = function (tabela, coluna, filtro) {
    return ler(tabela, 'select=' + coluna + (filtro || '') + '&order=' + coluna + '.desc&limit=1')
      .then(function (r) { return r[0] ? r[0][coluna] : null; });
  };

  Promise.all([
    ler('robo_status', 'select=ultima_batida,parar&id=eq.1'),
    ler('robo_sessoes', 'select=conta,caida_desde'),
    ler('robo_alertas', 'select=id,chave,mensagem,criado_em&resolvido_em=is.null&dispensado_em=is.null&gravidade=eq.grave&order=criado_em.desc'),
    ler('ml_tarefas_robo', 'select=id,conta,tipo,params,erro,concluido_em&status=eq.falhou&concluido_em=gte.' + ontem + '&order=concluido_em.desc&limit=100'),
    ler('ml_tarefas_robo', 'select=conta,tipo,params,concluido_em&status=eq.feito&concluido_em=gte.' + ontem + '&limit=1000'),
    ultimaDe('ml_patrulha_execucoes', 'quando'),
    ultimaDe('ml_anuncios', 'atualizado_em'),
    ultimaDe('ml_promocoes_itens', 'atualizado_em', '&conta=eq.KMP'),
    ultimaDe('ml_promocoes_itens', 'atualizado_em', '&conta=eq.ERP'),
    ultimaDe('ml_promocoes_itens', 'atualizado_em', '&conta=eq.LTS'),
  ]).then(function (r) {
    var dados = {
      status: r[0][0] || {},
      sessoes: r[1],
      alertas: r[2],
      falhas: falhasQueContam(r[3], r[4]),
      patrulha: r[5],
      catalogo: r[6],
      promocoes: { KMP: r[7], ERP: r[8], LTS: r[9] },
    };
    desenhar(dados);
    desenharRodada(dados);
    document.getElementById('atualizado').textContent = 'atualizado ' +
      new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }).catch(function () {
    var p = document.getElementById('painel');
    p.innerHTML = '';
    p.appendChild(el('div', { class: 'resposta ruim' }, [
      el('div', { class: 'sinal' }, ['📡']),
      el('div', { class: 'titulo' }, ['Não consegui conferir']),
      el('div', { class: 'sub' }, ['Sem internet, ou o servidor não respondeu. Feche e abra o app de novo.']),
    ]));
  }).then(function () { atualizando = false; });
}

// ── RODAR TUDO ───────────────────────────────────────────────────────────────
//
// Pedido do Matheus em 14/09/2026: longe de casa, no fim de semana, apertar um botão e
// TER CERTEZA de que tudo está rodando. "Certeza" é a palavra que manda aqui: o app não
// diz "pedido enviado" e pronto. Ele acompanha cada parte e só marca ✓ quando ela
// rodou de verdade DEPOIS do toque — o catálogo com data nova, a patrulha com registro
// novo, as promoções lidas de novo. Até lá, fica o relógio girando.
//
// A rodada fica guardada no aparelho: se o app for fechado no meio, ao abrir de novo o
// andamento continua de onde estava.
var rodada = null;
try { rodada = JSON.parse(localStorage.getItem('rodada') || 'null'); } catch (_e) { rodada = null; }
if (rodada && minutosDesde(rodada.desde) > 90) rodada = null;   // rodada velha não interessa

function guardarRodada() {
  try {
    if (rodada) localStorage.setItem('rodada', JSON.stringify(rodada));
    else localStorage.removeItem('rodada');
  } catch (_e) {}
}

function rodarTudo() {
  var b = document.getElementById('rodarTudo');
  b.disabled = true; b.textContent = 'Enviando…';
  acao({ acao: 'rodar_tudo' }).then(function (r) {
    // Toque duplo: o servidor não dispara de novo e devolve a rodada que já está andando.
    rodada = {
      desde: r.desde,
      robo_vivo: r.ja_rodando && rodada ? rodada.robo_vivo : r.robo_vivo,
      promocoes_na_fila: r.ja_rodando && rodada ? rodada.promocoes_na_fila : (r.promocoes_na_fila || []),
      promocoes_em_dia: r.ja_rodando && rodada ? rodada.promocoes_em_dia : (r.promocoes_em_dia || []),
    };
    guardarRodada();
    atualizar();
  }).catch(function (e) {
    document.getElementById('rodada').innerHTML = '';
    document.getElementById('rodada').appendChild(el('div', { class: 'rodada' }, [
      el('div', { class: 'passo nao' }, [el('span', { class: 'marca' }, ['✕']),
        el('span', { class: 'texto' }, ['Não consegui mandar rodar: ' + e.message])]),
    ]));
  }).then(function () {
    b.disabled = false; b.textContent = '↻ Rodar tudo';
  });
}

function desenharRodada(d) {
  var caixa = document.getElementById('rodada');
  caixa.innerHTML = '';
  if (!rodada) return;

  var desde = new Date(rodada.desde).getTime();
  var depois = function (iso) { return iso && new Date(iso).getTime() > desde; };
  var passos = [];

  function passo(estado, texto, quando) {
    var marca = estado === 'ok' ? '✓' : estado === 'nao' ? '✕' : null;
    passos.push(el('div', { class: 'passo ' + (estado === 'ok' ? '' : estado) }, [
      el('span', { class: 'marca' }, [marca ? marca : el('span', { class: 'girando' }, ['↻'])]),
      el('span', { class: 'texto' }, [texto]),
      quando ? el('span', { class: 'quando' }, [quando]) : null,
    ]));
    return estado;
  }

  var roboVivo = minutosDesde(d.status.ultima_batida) <= LIMITE.roboMin;
  var estados = [];

  // O robô: sem ele, a patrulha e as promoções não andam — e o app diz isso na hora,
  // em vez de deixar o relógio girando pra sempre.
  estados.push(passo(roboVivo ? 'ok' : 'nao',
    roboVivo ? 'Robô respondeu' : 'Robô desligado — a patrulha e as promoções esperam ele voltar',
    roboVivo ? haQuanto(d.status.ultima_batida) : null));

  // Catálogo: roda no servidor, não depende do robô.
  estados.push(passo(depois(d.catalogo) ? 'ok' : 'esperando',
    depois(d.catalogo) ? 'Catálogo relido' : 'Relendo o catálogo das 3 lojas… (uns 3 min)',
    depois(d.catalogo) ? haQuanto(d.catalogo) : null));

  // Patrulha, e junto dela sem estoque e Flex.
  if (roboVivo) {
    estados.push(passo(depois(d.patrulha) ? 'ok' : 'esperando',
      depois(d.patrulha) ? 'Patrulha feita (sem estoque e Flex conferidos)' : 'Patrulhando as 3 lojas… (uns 3 min)',
      depois(d.patrulha) ? haQuanto(d.patrulha) : null));
  }

  // Promoções: as em dia ficam em dia; as atrasadas mostram a leitura andando.
  if (rodada.promocoes_em_dia.length) {
    estados.push(passo('ok', 'Promoções em dia (' + rodada.promocoes_em_dia.join(', ') + ')', null));
  }
  if (roboVivo) {
    rodada.promocoes_na_fila.forEach(function (c) {
      estados.push(passo(depois(d.promocoes[c]) ? 'ok' : 'esperando',
        depois(d.promocoes[c]) ? 'Promoções da ' + c + ' lidas' : 'Lendo as promoções da ' + c + '… (uns 18 min)',
        depois(d.promocoes[c]) ? haQuanto(d.promocoes[c]) : null));
    });
  }

  var faltando = estados.filter(function (e) { return e === 'esperando'; }).length;
  var falhou = estados.indexOf('nao') !== -1;
  var terminou = !faltando;

  var fechar = el('button', { class: 'fechar' }, ['fechar']);
  fechar.addEventListener('click', function () { rodada = null; guardarRodada(); caixa.innerHTML = ''; });

  caixa.appendChild(el('div', { class: 'rodada' + (terminou && !falhou ? ' fim' : '') }, [
    el('div', { class: 'topo' }, [
      el('span', { class: 'titulo' }, [
        terminou ? (falhou ? 'Rodou, mas o robô está desligado' : '✓ Tudo rodou agora') : 'Rodando tudo…',
      ]),
      terminou ? fechar : el('span', { class: 'quando' }, ['desde ' + new Date(rodada.desde)
        .toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })]),
    ]),
  ].concat(passos)));

  // Enquanto roda, relê mais rápido que o normal pra ver cada ✓ aparecendo.
  acompanharRodada(!terminou);
}

var relogioRodada = null;
function acompanharRodada(ligar) {
  if (ligar && !relogioRodada) relogioRodada = setInterval(atualizar, 8000);
  if (!ligar && relogioRodada) { clearInterval(relogioRodada); relogioRodada = null; }
}

// Das tarefas que falharam, só o que ainda está de pé: uma linha por anúncio, e só se
// ele não deu certo numa tentativa seguinte. A primeira versão do app mostrou "8 coisas
// precisam de você" e nenhuma precisava — repetidas e já resolvidas.
function falhasQueContam(falhas, feitas) {
  function chave(t) { return t.conta + '|' + t.tipo + '|' + ((t.params && t.params.item_id) || t.id); }
  var ultimoSucesso = {};
  feitas.forEach(function (t) {
    var k = chave(t);
    if (!ultimoSucesso[k] || t.concluido_em > ultimoSucesso[k]) ultimoSucesso[k] = t.concluido_em;
  });
  var vistas = {};
  return falhas.filter(function (t) {
    var k = chave(t);
    if (vistas[k]) return false;
    vistas[k] = true;
    return !(ultimoSucesso[k] && ultimoSucesso[k] > t.concluido_em);
  });
}

var NOME_TAREFA = {
  tirar_do_full: 'Tirar do Full', ligar_flex: 'Ligar o Flex', desligar_flex: 'Desligar o Flex',
  varrer_promocoes: 'Ler promoções',
};

// Erro técnico cru não serve no celular. Uma frase curta basta pra saber se é grave.
function explicarErro(erro) {
  var t = String(erro || '');
  if (/sessão da .* caiu|tela de login/i.test(t)) return 'A sessão da loja estava caída.';
  if (/caixinha do Envios Flex/i.test(t)) return 'Não achou a opção de Flex na página do anúncio.';
  if (/botão Confirmar/i.test(t)) return 'A página do anúncio não confirmou a mudança.';
  if (/Navigation|navigat|Execution context|Target page|browser has been closed/i.test(t))
    return 'A página do Mercado Livre não carregou direito.';
  if (/HTTP 5\d\d|internal|Something went wrong/i.test(t)) return 'O Mercado Livre deu erro interno.';
  if (/HTTP 4\d\d|recusad/i.test(t)) return 'O Mercado Livre recusou a ação.';
  return t.length > 90 ? t.slice(0, 90) + '…' : t;
}

// ── Desenho ──────────────────────────────────────────────────────────────────
function desenhar(d) {
  var painel = document.getElementById('painel');
  painel.innerHTML = '';
  var st = d.status;
  var roboMin = minutosDesde(st.ultima_batida);
  var roboVivo = roboMin <= LIMITE.roboMin;
  var caidas = d.sessoes.filter(function (s) { return s.caida_desde; });

  // ── 2) O QUE PRECISA DE VOCÊ ──
  // Só entra aqui o que exige uma pessoa. Cada um diz o que é, o que fazer, e traz o
  // botão quando o celular consegue resolver.
  var pendencias = [];

  if (!roboVivo) {
    pendencias.push(el('div', { class: 'pendencia grave' }, [
      el('div', { class: 'o-que' }, ['Robô desligado']),
      el('div', { class: 'detalhe' }, ['Sem sinal ' + haQuanto(st.ultima_batida) + '.']),
      el('div', { class: 'como' }, [el('b', {}, ['Precisa de alguém no PC: ']),
        'veja se ele está ligado. O robô volta sozinho em até 5 minutos. Nada se perde — as tarefas esperam na fila.']),
    ]));
  }

  if (roboVivo && st.parar) {
    pendencias.push(el('div', { class: 'pendencia atencao' }, [
      el('div', { class: 'o-que' }, ['Robô pausado']),
      el('div', { class: 'detalhe' }, ['Alguém apertou "Parar robô". Ele está ligado, mas não pega tarefa nenhuma.']),
      botao('Retomar o robô', '', { acao: 'retomar_robo' }),
    ]));
  }

  // Sessão caída: o login só dá pra fazer no PC. O botão é pra DEPOIS disso — sem ele o
  // robô esperaria até 30 minutos pra perceber sozinho.
  caidas.forEach(function (s) {
    pendencias.push(el('div', { class: 'pendencia grave' }, [
      el('div', { class: 'o-que' }, ['Sessão da ' + s.conta + ' caiu']),
      el('div', { class: 'detalhe' }, ['Desde ' + quando(s.caida_desde) + '. A ' + s.conta + ' está parada; as outras lojas seguem normais.']),
      el('div', { class: 'como' }, [el('b', {}, ['Precisa de alguém no PC: ']),
        'entrar de novo na conta ' + s.conta + ' pelo Chrome do robô. Depois toque aqui:']),
      botao('Já reconectei, pode seguir', '', { acao: 'liberar_sessao', conta: s.conta }),
    ]));
  });

  // OS OUTROS AVISOS DO ROBÔ NÃO SÃO PENDÊNCIA.
  //
  // Anúncio preso no Full, patrulha que tropeçou: em todos o robô está tentando de novo,
  // e ninguém resolve pelo celular. Até 14/09/2026 eles apareciam aqui em vermelho com um
  // botão "Ok, já vi" — que só escondia o aviso. O Matheus apontou: "clicando em já vi
  // resolveu algo? acho que não". Botão que finge ser ação saiu. Esses avisos descem pra
  // área recolhida, como informação, e só se já passaram 20 minutos (antes disso quase
  // sempre é só o robô na fila, e somem sozinhos).
  var CARENCIA_MIN = 20;
  var avisosDoRobo = d.alertas.filter(function (a) {
    return a.chave.indexOf('sessao_caida:') !== 0 && a.chave.indexOf('tarefa_falhou:') !== 0
      && minutosDesde(a.criado_em) >= CARENCIA_MIN;
  });

  // ── 1) A RESPOSTA ──
  var n = pendencias.length;
  painel.appendChild(n
    ? el('div', { class: 'resposta ruim' }, [
        el('div', { class: 'sinal' }, ['✋']),
        el('div', { class: 'titulo' }, [n === 1 ? '1 coisa precisa de você' : n + ' coisas precisam de você']),
        el('div', { class: 'sub' }, ['Veja abaixo o que é e o que fazer.']),
      ])
    : el('div', { class: 'resposta ok' }, [
        el('div', { class: 'sinal' }, ['✓']),
        el('div', { class: 'titulo' }, ['Tudo rodando']),
        el('div', { class: 'sub' }, ['Nada precisa de você agora.']),
      ]));
  pendencias.forEach(function (p) { painel.appendChild(p); });

  // ── 3) COMO ESTÁ CADA PARTE ──
  // Pra conferir com os próprios olhos. Verde = em dia; amarelo = atrasado mas
  // resolve sozinho; vermelho = parado. Amarelo NÃO vira pendência nem notificação.
  function parte(nome, cor, estado) {
    return el('div', { class: 'parte' }, [
      el('span', { class: 'bolinha ' + cor }),
      el('span', { class: 'nome' }, [nome]),
      el('span', { class: 'estado' }, [estado]),
    ]);
  }

  var lojas = ['KMP', 'ERP', 'LTS'];
  var lojasCaidas = caidas.map(function (s) { return s.conta; });

  var promoAtrasadas = lojas.filter(function (c) { return minutosDesde(d.promocoes[c]) > LIMITE.promocoesMin; });
  // A leitura mais antiga das três é a que diz se está em dia. Loja sem leitura
  // nenhuma conta como a mais antiga de todas — senão pegaria a data de outra loja.
  var datasPromo = lojas.map(function (c) { return d.promocoes[c]; });
  var promoMaisVelha = datasPromo.indexOf(null) !== -1 ? null : datasPromo.slice().sort()[0];

  painel.appendChild(el('div', { class: 'secao' }, ['Como está cada parte']));
  painel.appendChild(el('div', { class: 'partes' }, [
    parte('Robô',
      !roboVivo ? 'ruim' : st.parar ? 'atencao' : 'ok',
      !roboVivo ? 'desligado' : st.parar ? 'pausado' : 'trabalhando'),
    parte('Lojas',
      lojasCaidas.length ? 'ruim' : 'ok',
      lojasCaidas.length ? lojasCaidas.join(', ') + ' desconectada' + (lojasCaidas.length > 1 ? 's' : '')
                         : 'as 3 conectadas'),
    parte('Patrulha',
      minutosDesde(d.patrulha) > LIMITE.patrulhaMin ? 'atencao' : 'ok',
      haQuanto(d.patrulha)),
    parte('Catálogo',
      minutosDesde(d.catalogo) > LIMITE.catalogoMin ? 'atencao' : 'ok',
      haQuanto(d.catalogo)),
    parte('Promoções',
      promoAtrasadas.length ? 'atencao' : 'ok',
      promoAtrasadas.length ? promoAtrasadas.join(', ') + ' ' + haQuanto(promoMaisVelha)
                            : 'lidas ' + haQuanto(promoMaisVelha)),
  ]));

  // O QUE O ROBÔ ESTÁ RESOLVENDO: recolhido. Não é assunto seu — é o robô tentando de
  // novo, ou coisa pra investigar. Fica à mão pra quem quiser olhar, mas fora do caminho.
  var totalRobo = d.falhas.length + avisosDoRobo.length;
  if (totalRobo) {
    var det = el('details', { class: 'falhas' }, [
      el('summary', {}, [el('span', {}, [
        totalRobo === 1 ? '1 coisa o robô está resolvendo' : totalRobo + ' coisas o robô está resolvendo',
      ])]),
    ]);
    avisosDoRobo.forEach(function (a) {
      det.appendChild(el('div', { class: 'falha' }, [
        el('div', { class: 'detalhe' }, [a.mensagem]),
      ]));
    });
    d.falhas.forEach(function (t) {
      var titulo = (t.params && t.params.title) || (t.params && t.params.item_id) || '';
      det.appendChild(el('div', { class: 'falha' }, [
        el('div', { class: 'o-que' }, [(NOME_TAREFA[t.tipo] || t.tipo) + ' · ' + t.conta]),
        titulo ? el('div', { class: 'detalhe' }, [titulo]) : null,
        el('div', { class: 'detalhe' }, [explicarErro(t.erro)]),
        botao('Tentar de novo', 'neutro', { acao: 'tentar_de_novo', id: t.id }),
      ]));
    });
    painel.appendChild(det);
  }
}

// ── Notificações ─────────────────────────────────────────────────────────────
function chaveParaBytes(base64) {
  var pad = '='.repeat((4 - base64.length % 4) % 4);
  var b = atob((base64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  var saida = new Uint8Array(b.length);
  for (var i = 0; i < b.length; i++) saida[i] = b.charCodeAt(i);
  return saida;
}
function instalado() {
  return window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
}
function ehIphone() { return /iphone|ipad|ipod/i.test(navigator.userAgent); }

function desenharAvisos() {
  var caixa = document.getElementById('avisos');
  caixa.innerHTML = '';
  var suporta = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

  // No iPhone, notificação só existe com o app na tela de início.
  if (ehIphone() && !instalado()) {
    caixa.appendChild(el('div', { class: 'ativar' }, [
      el('h2', {}, ['📲 Instale pra receber os avisos']),
      el('p', {}, ['No iPhone, os avisos só chegam com o app na tela de início:']),
      el('ol', {}, [
        el('li', {}, ['Toque em Compartilhar (quadrado com a seta pra cima)']),
        el('li', {}, ['Toque em "Adicionar à Tela de Início"']),
        el('li', {}, ['Abra o "Alertas" pelo ícone e ative os avisos']),
      ]),
    ]));
    return;
  }
  if (!suporta) {
    caixa.appendChild(el('div', { class: 'rodape' }, ['Este aparelho não aceita avisos.']));
    return;
  }

  navigator.serviceWorker.register('sw.js').then(function (reg) {
    return navigator.serviceWorker.ready.then(function () { return reg.pushManager.getSubscription(); })
      .then(function (inscricao) {
        // Ativos: vira uma linha discreta no rodapé. Não precisa ocupar a tela toda vez.
        if (inscricao && Notification.permission === 'granted') {
          var testar = el('button', {}, ['testar']);
          var rod = el('div', { class: 'rodape' }, ['🔔 Avisos ativados · ', testar]);
          testar.addEventListener('click', function () {
            testar.disabled = true; testar.textContent = 'enviando…';
            acao({ acao: 'teste' }).then(function () { testar.textContent = 'enviado ✓'; })
              .catch(function () { testar.disabled = false; testar.textContent = 'não deu, tentar de novo'; });
          });
          caixa.appendChild(rod);
          return;
        }
        if (Notification.permission === 'denied') {
          caixa.appendChild(el('div', { class: 'ativar' }, [
            el('h2', {}, ['🔕 Avisos bloqueados']),
            el('p', {}, ['Pra liberar: Ajustes → Notificações → Alertas → Permitir.']),
          ]));
          return;
        }
        var b = el('button', { class: 'acao' }, ['Ativar avisos']);
        var msg = el('div', { class: 'erro' });
        // O pedido de permissão TEM que sair de um toque — o iPhone ignora se vier sozinho.
        b.addEventListener('click', function () {
          b.disabled = true; b.textContent = 'Ativando…'; msg.textContent = '';
          Notification.requestPermission().then(function (perm) {
            if (perm !== 'granted') throw new Error('permissão não concedida');
            return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: chaveParaBytes(VAPID_PUBLICA) });
          }).then(function (s) {
            return acao({ acao: 'inscrever', inscricao: s.toJSON(), aparelho: navigator.userAgent });
          }).then(desenharAvisos).catch(function (e) {
            b.disabled = false; b.textContent = 'Ativar avisos'; msg.textContent = 'Não deu: ' + e.message;
          });
        });
        caixa.appendChild(el('div', { class: 'ativar' }, [
          el('h2', {}, ['🔔 Receber avisos neste celular']),
          el('p', {}, ['Robô desligado ou loja desconectada: chega na hora, mesmo com o app fechado. Nada de aviso à toa.']),
          b, msg,
        ]));
      });
  }).catch(function (e) {
    caixa.appendChild(el('div', { class: 'rodape' }, ['Não consegui preparar os avisos: ' + e.message]));
  });
}

// ── Início ───────────────────────────────────────────────────────────────────
document.getElementById('rodarTudo').addEventListener('click', rodarTudo);
atualizar();
desenharAvisos();
setInterval(atualizar, 60000);
// Voltou pro app ou tocou numa notificação: relê na hora.
document.addEventListener('visibilitychange', function () { if (!document.hidden) atualizar(); });
</script>
